/* ================= 主渲染 ================= */
function renderView(){
  const t0=performance.now();
  ({dashboard:renderDashboard,protection:renderProtection,network:renderNetwork,device:renderDevice,patching:renderPatching,edr:renderEDR,local:renderLocal,threat:renderThreat,compliance:renderCompliance,mgmt:renderMgmt,settings:renderSettings}[store.page]||renderDashboard)();
  renderNav();updateStatus();
}
function updateStatus(){
  const un=store.alerts.filter(a=>a.status!=='resolved').length;
  const pill=$('#statusPill');const txt=$('#statusPillTxt');
  if(un>0){pill.classList.add('warn');txt.textContent=`${un} 项待处置`;}
  else{pill.classList.remove('warn');txt.textContent='已保护';}
}
function render(){renderView();}

/* ================= 启动 ================= */
function init(){
  load();idb.open().then(loadQuar).catch(()=>{});
  applyTheme();
  $('#btnTheme').onclick=()=>{store.theme=store.theme==='dark'?'light':'dark';save();applyTheme();};
  $('#btnNotif').onclick=()=>showNotifs();
  $('#btnScanNow').onclick=()=>startScan('quick');
  if(REAL&&window.depk.onWatchEvent){window.depk.onWatchEvent(d=>{store.watchEvents.unshift(d);if(store.watchEvents.length>200)store.watchEvents.length=200;if(store.page==='local'&&store.tab==='watch')renderLocal();});}
  if(store.audit.length===0){audit('系统启动','DEPK Security Assistant 初始化完成');audit('登录','管理员通过 MFA 登录控制台');}
  renderView();
  setTimeout(()=>{toast('欢迎使用 DEPK Security Assistant，您的设备已受到保护','ok');},600);
}
