<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆包安全卫士 · Doubao Security</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234CC2FF'/%3E%3Cstop offset='1' stop-color='%2338A3F8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 1.5l8.5 3.2v5.6c0 5.6-3.6 10.4-8.5 12.2-4.9-1.8-8.5-6.6-8.5-12.2V4.7z'/%3E%3Cpath fill='%23fff' d='M10.8 15.2l-2.8-2.8 1.2-1.2 1.6 1.6 4-4 1.2 1.2z'/%3E%3C/svg%3E">
<style>
/* ============ Win11 Fluent Design System ============ */
:root{
  --bg:#1f1f1f; --bg-2:#262626; --panel:rgba(255,255,255,.045); --panel-solid:#2b2b2b;
  --panel-2:rgba(255,255,255,.07); --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.14);
  --text:#f3f3f3; --text-2:#c8c8c8; --text-3:#8f8f8f; --text-4:#6e6e6e;
  --accent:#4cc2ff; --accent-2:#7cd4ff; --accent-soft:rgba(76,194,255,.14); --accent-line:rgba(76,194,255,.4);
  --green:#35c759; --green-soft:rgba(53,199,89,.14); --amber:#f5b82e; --amber-soft:rgba(245,184,46,.14);
  --red:#f44b5a; --red-soft:rgba(244,75,90,.14); --purple:#b884f5; --purple-soft:rgba(184,132,245,.14);
  --cyan:#2fd8c7; --cyan-soft:rgba(47,216,199,.14);
  --radius:8px; --radius-s:6px; --radius-l:12px;
  --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.25);
  --font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --mica:rgba(32,32,32,.78);
}
[data-theme="light"]{
  --bg:#f3f3f3; --bg-2:#ebebeb; --panel:rgba(255,255,255,.72); --panel-solid:#ffffff;
  --panel-2:rgba(0,0,0,.045); --border:rgba(0,0,0,.09); --border-2:rgba(0,0,0,.16);
  --text:#1b1b1b; --text-2:#3f3f3f; --text-3:#6e6e6e; --text-4:#9a9a9a;
  --accent:#0078d4; --accent-2:#0067b8; --accent-soft:rgba(0,120,212,.1); --accent-line:rgba(0,120,212,.35);
  --green:#0f9d4f; --green-soft:rgba(15,157,79,.1); --amber:#c78a00; --amber-soft:rgba(199,138,0,.1);
  --red:#d13438; --red-soft:rgba(209,52,56,.1); --purple:#7c4fe0; --purple-soft:rgba(124,79,224,.1);
  --cyan:#0b8f83; --cyan-soft:rgba(11,143,131,.1);
  --shadow:0 8px 24px rgba(0,0,0,.12); --shadow-s:0 2px 8px rgba(0,0,0,.08);
  --mica:rgba(243,243,243,.8);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.55);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--accent);text-decoration:none}
button{font-family:var(--font);border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:var(--font);color:var(--text);background:var(--panel-2);border:1px solid var(--border-2);border-radius:var(--radius-s);padding:8px 12px;font-size:13px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent-line)}
[data-theme="light"] input{background:#fff}
h1,h2,h3,h4{font-weight:600;letter-spacing:.2px}
svg{display:block}
.mono{font-family:var(--mono)}

/* ============ Layout ============ */
.app{display:flex;height:100vh;width:100vw}
.nav{width:230px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--mica);backdrop-filter:blur(40px) saturate(160%);-webkit-backdrop-filter:blur(40px) saturate(160%);transition:width .18s ease;z-index:20}
.nav.collapsed{width:66px}
.nav-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;white-space:nowrap;overflow:hidden}
.nav-brand .logo{width:30px;height:30px;flex-shrink:0}
.nav-brand .brand-txt{display:flex;flex-direction:column;line-height:1.15}
.nav-brand .brand-txt b{font-size:14.5px;font-weight:600}
.nav-brand .brand-txt span{font-size:10.5px;color:var(--text-3);letter-spacing:1px}
.nav-items{flex:1;overflow-y:auto;padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--radius-s);color:var(--text-2);cursor:pointer;transition:background .12s,color .12s;white-space:nowrap;position:relative}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--accent)}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-item .lbl{font-size:13px;overflow:hidden;text-overflow:ellipsis}
.nav.collapsed .nav-item{justify-content:center;padding:9px 0}
.nav.collapsed .lbl,.nav.collapsed .brand-txt,.nav.collapsed .nav-foot .f-txt{display:none}
.nav-foot{padding:12px 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.nav-foot .nav-item{font-size:12px}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--border);background:var(--mica);backdrop-filter:blur(40px) saturate(160%);-webkit-backdrop-filter:blur(40px) saturate(160%);z-index:10}
.topbar .tb-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.topbar .tb-title .crumb{color:var(--text-3);font-weight:400;font-size:13px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.status-pill{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--green-soft);color:var(--green);border:1px solid var(--border)}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.2s infinite}
.status-pill.warn{background:var(--amber-soft);color:var(--amber)}
.status-pill.warn .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-2)}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-s);display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .12s,color .12s;position:relative}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .badge{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 30px 60px}
.view-inner{max-width:1500px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:600}
.page-head p{color:var(--text-3);font-size:13px;margin-top:4px}
.page-actions{display:flex;gap:10px;align-items:center}

/* ============ Components ============ */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-l);padding:20px;transition:box-shadow .15s,border-color .15s}
.card.hover:hover{box-shadow:var(--shadow-s);border-color:var(--border-2)}
.card-title{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-title .sub{font-size:11.5px;color:var(--text-3);font-weight:400}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:16px}
.row.wrap{flex-wrap:wrap}
.flex{display:flex;align-items:center;gap:10px}
.flex.between{justify-content:space-between}
.flex.col{flex-direction:column;align-items:stretch}
.grow{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 16px;border-radius:var(--radius-s);font-size:13px;font-weight:600;transition:background .12s,transform .05s,box-shadow .12s;user-select:none}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2)}
.btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border-2)}
.btn-secondary:hover{background:var(--panel)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{background:var(--panel-2);color:var(--text)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:rgba(244,75,90,.24)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{filter:brightness(1.08)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:5px}
.btn-lg{padding:11px 24px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.toggle{position:relative;width:42px;height:22px;border-radius:12px;background:var(--text-4);transition:background .18s;flex-shrink:0;cursor:pointer}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .18s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:22px}
.toggle.green.on{background:var(--green)}
.toggle.red.on{background:var(--red)}
.tgl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:var(--radius-s);transition:background .12s}
.tgl-row:hover{background:var(--panel-2)}
.tgl-row .t-info{display:flex;flex-direction:column;gap:1px}
.tgl-row .t-title{font-size:13px;font-weight:600}
.tgl-row .t-desc{font-size:11.5px;color:var(--text-3)}
.tgl-row .t-extra{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:6px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;line-height:1.5}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.purple{background:var(--purple-soft);color:var(--purple)}
.pill.cyan{background:var(--cyan-soft);color:var(--cyan)}
.pill.gray{background:var(--panel-2);color:var(--text-3)}

.badge-num{display:inline-flex;min-width:22px;height:22px;padding:0 7px;align-items:center;justify-content:center;border-radius:11px;font-size:11px;font-weight:700;background:var(--accent);color:#fff}

.sev{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.sev.crit{background:var(--red);box-shadow:0 0 6px var(--red)}
.sev.high{background:#ff7a45}
.sev.med{background:var(--amber)}
.sev.low{background:var(--cyan)}
.sev.info{background:var(--accent)}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.8px;min-width:640px}
.tbl th{text-align:left;padding:10px 14px;font-size:11.5px;font-weight:600;color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel-2)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl td .mono{font-size:11px;color:var(--text-3)}
.tbl .num{font-variant-numeric:tabular-nums}
.tbl-actions{display:flex;gap:6px}

.tabbar{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:3px;overflow-x:auto;flex-shrink:0}
.tabbar .tab{padding:7px 15px;border-radius:6px;font-size:12.8px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:background .12s,color .12s}
.tabbar .tab:hover{color:var(--text)}
.tabbar .tab.active{background:var(--panel-solid);color:var(--text);box-shadow:var(--shadow-s)}
[data-theme="light"] .tabbar .tab.active{background:#fff}
.tabbar.pills{background:none;border:none;padding:0;gap:6px}
.tabbar.pills .tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border-2);background:var(--panel)}
.tabbar.pills .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:none}

.progress{height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.progress .bar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .25s;position:relative}
.progress .bar.striped{background-image:linear-gradient(45deg,rgba(255,255,255,.22) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.22) 75%,transparent 75%,transparent);background-size:18px 18px;animation:stripes 1s linear infinite}

.input-group{display:flex;gap:8px}
.input-group input{flex:1}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{width:min(560px,92vw);max-height:86vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--border-2);border-radius:var(--radius-l);box-shadow:var(--shadow);transform:translateY(10px) scale(.98);transition:transform .15s}
.modal-mask.show .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 12px}
.modal-head h3{font-size:16px}
.modal-body{padding:4px 22px 16px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--border)}

.toasts{position:fixed;top:64px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius);background:var(--panel-solid);border:1px solid var(--border-2);box-shadow:var(--shadow);font-size:13px;animation:slidein .2s ease;max-width:360px}
.toast .t-ico{width:20px;height:20px;flex-shrink:0}
.toast.ok .t-ico{color:var(--green)}
.toast.err .t-ico{color:var(--red)}
.toast.warn .t-ico{color:var(--amber)}
.toast.info .t-ico{color:var(--accent)}
.toast.out{animation:fadeout .25s forwards}

/* ============ Dashboard ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{display:flex;align-items:center;gap:14px;padding:18px}
.kpi .k-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi .k-ico svg{width:24px;height:24px}
.kpi .k-val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k-lbl{font-size:12px;color:var(--text-3);margin-top:2px}
.kpi .k-delta{font-size:11px;margin-top:2px}
.hero-shield{display:flex;align-items:center;gap:20px;padding:24px;background:linear-gradient(135deg,rgba(76,194,255,.12),rgba(53,199,89,.1)),var(--panel);border:1px solid var(--border);border-radius:var(--radius-l)}
.hero-shield .shield-big{width:86px;height:86px;flex-shrink:0;filter:drop-shadow(0 8px 20px rgba(76,194,255,.35))}
.hero-shield .hs-title{font-size:20px;font-weight:700}
.hero-shield .hs-sub{color:var(--text-2);font-size:13px;margin-top:4px}
.hero-shield .hs-btns{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.quick-card{display:flex;flex-direction:column;gap:10px;padding:16px;cursor:pointer}
.quick-card .qc-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.quick-card .qc-ico svg{width:20px;height:20px}
.quick-card .qc-t{font-size:13.5px;font-weight:600}
.quick-card .qc-d{font-size:11.5px;color:var(--text-3);line-height:1.4}

/* ============ Charts (SVG) ============ */
.chart-box{position:relative;width:100%}
.chart-box svg{width:100%;height:auto}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.chart-legend .lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2)}
.chart-legend .lg i{width:10px;height:10px;border-radius:3px}

/* ============ Timeline / lists ============ */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border-2)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel-solid);border:3px solid var(--accent)}
.tl-item.crit::before{border-color:var(--red)}.tl-item.high::before{border-color:#ff7a45}.tl-item.med::before{border-color:var(--amber)}.tl-item.low::before{border-color:var(--cyan)}
.tl-time{font-size:11px;color:var(--text-3);font-family:var(--mono)}
.tl-title{font-size:13px;font-weight:600;margin-top:2px}
.tl-desc{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.5}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--panel-2)}

/* ============ Scan / engine ============ */
.scan-visual{position:relative;height:150px;border-radius:var(--radius);overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,rgba(76,194,255,.14),transparent 60%),var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.scan-ring{position:relative;width:110px;height:110px;border-radius:50%;border:3px solid var(--border-2);display:flex;align-items:center;justify-content:center}
.scan-ring.running{border-top-color:var(--accent);animation:spin 1.1s linear infinite}
.scan-ring .sr-ico{position:absolute;animation:spin-rev 1.1s linear infinite;width:40px;height:40px;color:var(--accent)}
.scan-ring.running .sr-ico{animation:spin 1.1s linear infinite}
.scan-files{position:absolute;font-family:var(--mono);font-size:11px;color:var(--text-3);bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.scan-stats{display:flex;gap:28px;justify-content:center;margin-top:14px}
.scan-stat{text-align:center}
.scan-stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.scan-stat .l{font-size:11px;color:var(--text-3)}

/* ============ Misc ============ */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:600;background:var(--panel-2);color:var(--text-3);border:1px solid var(--border)}
.empty{text-align:center;padding:44px 20px;color:var(--text-3);font-size:13px}
.empty svg{width:52px;height:52px;margin:0 auto 12px;opacity:.4}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.8px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-3)}
.kv .v{font-weight:600;text-align:right;word-break:break-all}
.alert-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px;background:var(--panel);transition:transform .1s}
.alert-row:hover{transform:translateX(3px)}
.alert-row.crit{border-left:3px solid var(--red)}
.alert-row.high{border-left:3px solid #ff7a45}
.alert-row.med{border-left:3px solid var(--amber)}
.alert-row.low{border-left:3px solid var(--cyan)}
.attr-map{display:flex;gap:6px;flex-wrap:wrap}
.attr-map .a{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:4px;background:var(--purple-soft);color:var(--purple)}
.stat-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:16px;font-size:11.5px;font-weight:600;background:var(--panel-2);border:1px solid var(--border)}
.mini-line{width:100%;height:44px}
.dropzone{border:2px dashed var(--border-2);border-radius:var(--radius-l);padding:36px 20px;text-align:center;color:var(--text-3);transition:border-color .15s,background .15s;cursor:pointer}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.dropzone svg{width:40px;height:40px;margin:0 auto 10px;opacity:.6}
.dropzone b{color:var(--text-2)}
.notif-item{display:flex;gap:12px;padding:12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--panel);margin-bottom:8px}
.notif-item .ni-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-item .ni-ico svg{width:18px;height:18px}
.proto-tree{font-family:var(--mono);font-size:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;overflow-x:auto;line-height:1.7;color:var(--text-2)}
.proto-tree .k{color:var(--accent)}
.proto-tree .v{color:var(--green)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow .node{padding:8px 14px;border-radius:var(--radius-s);background:var(--panel-2);border:1px solid var(--border-2);font-size:12px;font-weight:600;text-align:center}
.flow .node.hit{background:var(--red-soft);border-color:rgba(244,75,90,.4);color:var(--red)}
.flow .node.warn-hit{background:var(--amber-soft);border-color:rgba(245,184,46,.4);color:var(--amber)}
.flow .arrow{color:var(--text-4);font-size:13px}
.score-ring{position:relative;width:120px;height:120px;margin:0 auto}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .sr-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring .sr-txt b{font-size:28px;font-weight:700}
.score-ring .sr-txt span{font-size:10.5px;color:var(--text-3)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes stripes{to{background-position:18px 0}}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeout{to{opacity:0;transform:translateX(20px)}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view-fade{animation:fadeup .22s ease}
.pagerow{display:flex;align-items:center;gap:14px;margin-bottom:16px}

/* ============ Responsive ============ */
@media(max-width:1240px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:repeat(2,1fr)}.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .nav{width:66px}
  .nav .lbl,.nav .brand-txt,.nav .f-txt{display:none}
  .nav-item{justify-content:center;padding:9px 0}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .hero-shield{flex-wrap:wrap}
  .hero-shield .hs-btns{margin-left:0}
  .view{padding:18px 14px 50px}
  .topbar{padding:0 14px}
}

<script>
/* =====================================================
   DEPK Security Assistant - 共享检测引擎（纯函数，无 DOM 依赖）
   同时被：渲染进程（浏览器版） 与 主进程（Electron 真实扫描）加载
   ===================================================== */
(function(global){
'use strict';
const PAT={ransom:/WANNACRY|WNCRY|RYUK|LOCKBIT|YOUR FILES ARE ENCRYPTED|HOW TO DECRYPT|\.LOCK\b|README_TO_DECRYPT|vssadmin[\s\S]{0,20}delete|bcdedit[\s\S]{0,20}recoveryenabled/i,
 miner:/XMRIG|STRATUM\+TCP|MINERGATE|NICEHASH|KAWPOW|CRYPTONIGHT|POOL\.XMR/i,
 script:/invoke-expression|IEX\s*\(|FromBase64String|DownloadString|DownloadFile|WScript\.Shell|MSHTA|Regsvr32[\s\S]{0,30}scrobj|certutil[\s\S]{0,30}urlcache|bitsadmin[\s\S]{0,30}transfer|net\s+user[\s\S]{0,20}\/add|mimikatz|DisableRealtimeMonitoring|Add-MpPreference|Set-MpPreference|cmd\.exe\s+\/c|powershell\s+-enc|GetAsyncKeyState|SetWindowsHookEx|WH_KEYBOARD_LL|VirtualAllocEx|CreateRemoteThread|Shell\.Application|FSO\.OpenTextFile/i,
 macro:/AUTOOPEN|WORKBOOK_OPEN|DOCUMENT_OPEN|vbaProject|Auto_Open|VBA_STANDARD|shell\s*\(/i,
 phish:/URGENT.*INVOICE|ACCOUNT.*VERIFY|GIFT CARD|WIRE TRANSFER|BITCOIN.*PAYMENT/i,
 spy:/GetAsyncKeyState|SetWindowsHookEx|WH_KEYBOARD|Clipboard\.GetText|keylog|ScreenCapture|OpenCV.*VideoCapture/i,
 autostart:/\[autorun\]|Shell\s*=\s*command|open\s*=\s*[a-z]:\\/i};
function rd32(b,o){if(o+4>b.length)return 0;return b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24);}
function entropy(buf){const len=Math.min(buf.length,65536);if(len<8)return 0;const freq=new Array(256).fill(0);for(let i=0;i<len;i++)freq[buf[i]]++;let e=0;for(let i=0;i<256;i++){if(freq[i]){const p=freq[i]/len;e-=p*Math.log2(p);}}return e;}
function isExt(name,exts){const i=name.lastIndexOf('.');if(i<0)return false;return exts.includes(name.slice(i+1).toLowerCase());}
function analyzeBuf(buf,name){
  const rules=[], str=(()=>{const max=Math.min(buf.length,1048576);let s='';for(let i=0;i<max;i++){s+=String.fromCharCode(buf[i]);if(s.length>262144){s=s.slice(-262144);}}return s;})();
  const upper=str.toUpperCase();const en=entropy(buf);const isPE=buf[0]===0x4D&&buf[1]===0x5A;const nm=name||'';
  if(str.includes('X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'))rules.push({id:'EICAR',name:'EICAR 标准测试文件',type:'测试病毒',sev:'low',score:20,desc:'标准防病毒测试特征串，用于验证防护是否生效'});
  let peInfo=null;
  if(isPE&&buf.length>0x40){try{const peOff=buf[0x3C]|(buf[0x3D]<<8)|(buf[0x3E]<<16)|(buf[0x3F]<<24);if(peOff>0&&peOff+6<buf.length&&buf[peOff]===0x50&&buf[peOff+1]===0x45){
    const magic=buf[peOff+24]|(buf[peOff+25]<<8);const is64=magic===0x20B;const nsec=buf[peOff+6]|(buf[peOff+7]<<8);const opt=peOff+24;const secOff=opt+(is64?240:224);const ddOff=opt+(is64?112:96);
    const secs=[];for(let i=0;i<nsec&&i<64;i++){const o=secOff+i*40;if(o+40>buf.length)break;const nm2=String.fromCharCode(...buf.slice(o,o+8)).replace(/\0+$/,'');secs.push({name:nm2,vSize:rd32(buf,o+8),vAddr:rd32(buf,o+12),rawSize:rd32(buf,o+16),rawPtr:rd32(buf,o+20)});}
    const impRva=rd32(buf,ddOff+8);const impSize=rd32(buf,ddOff+12);const rva2off=rva=>{for(const s of secs){if(rva>=s.vAddr&&rva<s.vAddr+Math.max(s.rawSize,s.vSize))return s.rawPtr+(rva-s.vAddr);}return -1;};
    let dlls=[],funcs=[];if(impRva&&impSize){const io=rva2off(impRva);if(io>=0){for(let d=0;d<64;d++){const o=io+d*20;if(o+20>buf.length)break;const nameRva=rd32(buf,o+12);const no=nameRva?rva2off(nameRva):-1;if(no<0)break;let dll='';for(let j=no;j<buf.length&&j<no+128;j++){if(buf[j]===0)break;dll+=String.fromCharCode(buf[j]);}dlls.push(dll.toLowerCase());const ftRva=rd32(buf,o+16);const fo=ftRva?rva2off(ftRva):-1;if(fo>0){for(let k=0;k<128;k++){const w=rd32(buf,fo+k*4);const isOrd=w&0x80000000;if(w===0)break;if(!isOrd){const fo2=rva2off(w&0x7FFFFFFF);if(fo2>0){let fn='';for(let j=fo2;j<buf.length&&j<fo2+64;j++){if(buf[j]===0)break;fn+=String.fromCharCode(buf[j]);}if(fn){funcs.push(fn);}}}}}}

  }}catch(e){}}
  if(peInfo){
    if(peInfo.packed)rules.push({id:'PACKED',name:'加壳程序',type:'风险程序',sev:'med',score:45,desc:'检测到 UPX/加壳特征，加壳常见于恶意样本规避检测'});
    const inj=['VirtualAlloc','VirtualAllocEx','WriteProcessMemory','CreateRemoteThread','SetThreadContext','NtUnmapViewOfSection'];
    const hit=inj.filter(f=>peInfo.funcs.includes(f));
    if(hit.length>=3)rules.push({id:'INJECT',name:'进程注入特征',type:'木马/远控',sev:'high',score:80,desc:'导入表含进程注入 API 组合：'+hit.join('、')});
    const key=['GetAsyncKeyState','SetWindowsHookExA','SetWindowsHookExW'];
    if(key.some(f=>peInfo.funcs.includes(f)))rules.push({id:'KEYLOG',name:'键盘记录特征',type:'间谍软件',sev:'high',score:78,desc:'导入键盘钩子/按键状态 API，疑似键盘记录器'});

  }
  if(PAT.ransom.test(str))rules.push({id:'RANSOM',name:'勒索软件特征',type:'勒索软件',sev:'crit',score:92,desc:'命中勒索声明/卷影删除/自启动等勒索行为特征'});
  if(PAT.miner.test(str))rules.push({id:'MINER',name:'挖矿程序特征',type:'挖矿程序',sev:'high',score:82,desc:'命中矿池地址/挖矿算法特征'});
  const scriptExt=isExt(nm,['ps1','bat','cmd','js','vbs','hta','scr','wsf']);
  if(scriptExt&&PAT.script.test(str))rules.push({id:'SCRIPT',name:'恶意脚本特征',type:'脚本病毒',sev:'high',score:75,desc:'脚本包含下载执行/编码载荷/持久化等危险命令'});
  if(PAT.spy.test(str)&&(scriptExt||isPE))rules.push({id:'SPY',name:'间谍行为特征',type:'间谍软件',sev:'high',score:76,desc:'检测到键盘记录/屏幕捕获行为代码'});
  if((isExt(nm,['docm','xlsm','pptm','doc','xls','ppt'])||upper.includes('PK'))&&PAT.macro.test(str))rules.push({id:'MACRO',name:'宏病毒特征',type:'宏病毒',sev:'med',score:58,desc:'Office 文档含可疑 VBA 宏（AutoOpen/Shell）'});
  if(nm.toLowerCase()==='autorun.inf'&&PAT.autostart.test(str))rules.push({id:'AUTORUN',name:'Autorun 蠕虫',type:'蠕虫',sev:'med',score:55,desc:'可移动介质自启动项，U 盘蠕虫典型载体'});
  const dn=nm.toLowerCase();
  if(/\.(exe|scr|bat|cmd|js|vbs|ps1|jar|hta|com|pif)(\.|$)/i.test(dn)&&/\.(doc|pdf|xls|jpg|png|zip|rar)\./.test(dn))rules.push({id:'DBLEXT',name:'双扩展名伪装',type:'木马',sev:'high',score:72,desc:'文件使用双扩展名伪装常见文档格式'});
  if(PAT.phish.test(str)&&isExt(nm,['eml','msg','html','htm']))rules.push({id:'PHISH',name:'钓鱼邮件特征',type:'钓鱼攻击',sev:'med',score:52,desc:'邮件内容命中紧急付款/凭证验证等钓鱼话术'});
  const crit=rules.filter(r=>r.sev==='crit'),high=rules.filter(r=>r.sev==='high'),med=rules.filter(r=>r.sev==='med');
  let verdict='无威胁',sev='low',score=0;
  if(crit.length){verdict=crit[0].type;sev='crit';score=Math.max(...crit.map(r=>r.score));}
  else if(high.length){verdict=high[0].type;sev='high';score=Math.max(...high.map(r=>r.score));}
  else if(med.length){verdict=med[0].type;sev='med';score=Math.max(...med.map(r=>r.score));}
  return {verdict,sev,score,rules,entropy:en,pe:peInfo};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'id'+Math.random().toString(36).slice(2,10);
const now=()=>new Date();
function fmtDT(d){d=d||new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}
function relT(ts){const s=(Date.now()-ts)/1000;if(s<60)return '刚刚';if(s<3600)return Math.floor(s/60)+' 分钟前';if(s<86400)return Math.floor(s/3600)+' 小时前';return Math.floor(s/86400)+' 天前';}
function fmtSize(b){if(b==null)return'-';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB';}
async function sha256(buf){const d=await crypto.subtle.digest('SHA-256',buf);return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function entropy(buf){const len=Math.min(buf.length,65536);if(len<8)return 0;const freq=new Array(256).fill(0);for(let i=0;i<len;i++)freq[buf[i]]++;let e=0;for(let i=0;i<256;i++){if(freq[i]){const p=freq[i]/len;e-=p*Math.log2(p);}}return e;}
function toBlobUrl(data){return URL.createObjectURL(new Blob([data]));}
function download(name,content,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime||'application/octet-stream'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
function copyText(t){navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('已复制到剪贴板','ok')).catch(()=>toast('复制失败','err'));}

function toast(msg,type='info'){const box=$('#toasts');const t=document.createElement('div');t.className='toast '+type;
  const ico=type==='ok'?I.check:type==='err'?I.x:type==='warn'?I.warn:I.info;
  t.innerHTML=`<span class="t-ico">${ico}</span><span>${esc(msg)}</span>`;
  box.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260);},3400);}

/* ================= 弹窗 ================= */
let modalCb=null;
function modal(html,{title='',okTxt='确定',cancelTxt='取消',showCancel=true,okClass='btn-primary',onOk=null,wide=false}={}){
  const m=$('#modalMask'),b=$('#modalBox');
  b.className='modal'+(wide?' wide':'');
  b.innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" id="mClose">${I.x}</button></div>
  <div class="modal-body">${html}</div>
  ${showCancel||onOk?`<div class="modal-foot"><button class="btn btn-ghost" id="mCancel">${esc(cancelTxt)}</button><button class="btn ${okClass}" id="mOk">${esc(okTxt)}</button></div>`:''}`;
  m.classList.add('show');modalCb=onOk;
  const close=()=>{m.classList.remove('show');modalCb=null;};
  b.querySelector('#mClose').onclick=close;
  const c=b.querySelector('#mCancel');if(c)c.onclick=close;
  const o=b.querySelector('#mOk');if(o)o.onclick=()=>{const r=onOk?onOk():true;if(r!==false)close();};
  m.onclick=e=>{if(e.target===m)close();};
  return close;
}
function confirmDlg(title,desc,onOk,okTxt='确定',okClass='btn-danger'){modal(`<p style="font-size:13.5px;line-height:1.7">${desc}</p>`,{title,okTxt,okClass,onOk});}

/* ================= SVG 图表库 ================= */
function svgLine(sel,data,{h=150,color='var(--accent)',fill=true,labels=true,max=null,minW=null}={}){
  const maxV=max||Math.max(...data)*1.15;const W=640,H=h,P=6;
  const pts=data.map((v,i)=>[P+i*(W-2*P)/Math.max(1,data.length-1),H-P-(v/maxV)*(H-2*P)]);
  const path='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
  const area=path+`L${pts[pts.length-1][0].toFixed(1)} ${H-P}L${pts[0][0].toFixed(1)} ${H-P}Z`;
  let dots='';if(labels)dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--panel-solid)" stroke="${color}" stroke-width="2"><title>${data[i]}</title></circle>`).join('');
  const gid=uid();
  $(sel).innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${fill?`<path d="${area}" fill="url(#${gid})"/>`:''}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function svgBars(sel,items,{h=170,color='var(--accent)'}={}){
  const W=640,H=h,P=8;const maxV=Math.max(...items.map(i=>i.v))*1.2;
  const bw=(W-2*P)/items.length*0.55;
  const bars=items.map((it,i)=>{const x=P+i*(W-2*P)/items.length+(W-2*P)/items.length*0.225;const bh=Math.max(2,(it.v/maxV)*(H-30));const y=H-22-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${it.c||color}"><title>${esc(it.l)}: ${it.v}</title></rect><text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text-3)">${esc(it.l)}</text>`;}).join('');
  $(sel).innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}</svg>`;
}
function svgDonut(sel,items,{size=150,hole=0.62}={}){ // items:[{l,v,c}]
  const R=size/2, r=R*hole, C=2*Math.PI*R, total=items.reduce((s,i)=>s+i.v,0)||1;
  let off=0;const segs=items.map(it=>{const frac=it.v/total;const dash=frac*C;const s=`<circle r="${R}" cx="${R}" cy="${R}" fill="none" stroke="${it.c}" stroke-width="${R-r}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${R} ${R})"><title>${esc(it.l)}: ${it.v} (${(frac*100).toFixed(1)}%)</title></circle>`;off+=dash;return s;}).join('');
  $(sel).innerHTML=`<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;margin:0 auto">${segs}<circle r="${r}" cx="${R}" cy="${R}" fill="var(--panel-solid)" stroke="none"/></svg>`;
}
function spark(sel,data,color){svgLine(sel,data,{h:44,labels:false,fill:true,color});}
function scoreRing(sel,val,color){const R=56,C=2*Math.PI*R;$(sel).innerHTML=`<div class="score-ring"><svg viewBox="0 0 120 120"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--panel-2)" stroke-width="10"/><circle r="${R}" cx="60" cy="60" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(val/100*C).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="sr-txt"><b style="color:${color}">${val}</b><span>/ 100</span></div></div>`;}

<script>
/* 检测引擎由 engine-shared.js（DEPKEngine）提供，本段已移除重复定义 */

/* ================= IndexedDB 封装 ================= */
const idb={db:null,open(){return new Promise((res,rej)=>{const rq=indexedDB.open('ds-security',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onsuccess=()=>{this.db=rq.result;res();};rq.onerror=()=>rej(rq.error);});},
 get(k){return new Promise(res=>{if(!this.db)return res(null);const rq=this.db.transaction('kv').objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);});},
 set(k,v){return new Promise(res=>{if(!this.db)return res();this.db.transaction('kv','readwrite').objectStore('kv').put(v,k).onsuccess=()=>res();});},
 del(k){return new Promise(res=>{if(!this.db)return res();this.db.transaction('kv','readwrite').objectStore('kv').delete(k).onsuccess=()=>res();});}};
let cryKey=null;
async function getCryKey(){if(cryKey)return cryKey;const raw=await idb.get('cryKey');if(raw){cryKey=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);return cryKey;}
  cryKey=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);const r=await crypto.subtle.exportKey('raw',cryKey);await idb.set('cryKey',r);return cryKey;}
async function encBlob(buf){const k=await getCryKey();const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,buf);return{iv:Array.from(iv),data:new Uint8Array(ct)};}
async function decBlob(rec){const k=await getCryKey();const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(rec.iv)},k,rec.data);return pt;}

/* ================= 隔离区 ================= */
async function loadQuar(){const q=await idb.get('quar');if(q)store.quarantine=q;return store.quarantine;}
async function saveQuar(){await idb.set('quar',store.quarantine);}
async function qAdd(item,buf){const enc=await encBlob(buf);store.quarantine.unshift({...item,enc,id:item.id||uid()});await saveQuar();audit('文件隔离',`隔离 ${item.name} (${item.verdict})`);}
async function qRemove(id,alsoRestore){const i=store.quarantine.findIndex(x=>x.id===id);if(i<0)return;const item=store.quarantine[i];
  if(alsoRestore){try{const pt=await decBlob(item);const nm=(item.name||'restored').replace(/[\\/:*?"<>|]/g,'_');download(nm,pt,'application/octet-stream');toast('已导出恢复文件','ok');}catch(e){toast('恢复失败：密钥或数据损坏','err');}}
  store.quarantine.splice(i,1);await saveQuar();audit('隔离区管理',`${alsoRestore?'恢复':'删除'}隔离文件 ${item.name}`);}
async function qExport(id){const item=store.quarantine.find(x=>x.id===id);if(!item)return;try{const pt=await decBlob(item);download((item.name||'quarantine').replace(/[\\/:*?"<>|]/g,'_'),pt,'application/octet-stream');toast('已导出隔离副本','ok');}catch(e){toast('导出失败','err');}}

/* ================= 文件句柄缓存（用于隔离后删除原件） ================= */
const handleMap={};
let scanRun=null; // {mode,path,status,scanned,found,total,start,currentFile,abort}

/* ================= 扫描引擎 ================= */
const MAX_READ=4*1048576,MAX_FILES=3000;
async function readHead(f){if(f.arrayBuffer){const buf=await f.slice(0,MAX_READ).arrayBuffer();return new Uint8Array(buf);}if(f.getFile){const fl=await f.getFile();return readHead(fl);}return null;}
async function scanFileObj(file,path){const buf=await readHead(file);if(!buf)return null;const hash=await sha256(buf);const r=analyzeBuf(buf,file.name);return{name:file.name,path:path||file.name,size:file.size,hash,time:Date.now(),...r,id:uid()};}
async function scanDirHandle(dir,path,onFile){let n=0;for await(const ent of dir.values()){if(scanRun&&scanRun.abort)throw new Error('aborted');if(n>=MAX_FILES)break;if(ent.kind==='file'){try{const f=await ent.getFile();await onFile(f,path+'\\'+ent.name,ent);n++;}catch(e){}}else if(ent.kind==='directory'&&ent.name!=='$RECYCLE.BIN'){n+=await scanDirHandle(ent,path+'\\'+ent.name,onFile);}}return n;}
async function realScan(mode,path){
  scanRun={mode,path,status:'running',scanned:0,found:0,total:0,start:Date.now(),currentFile:'',abort:false};
  const threats=[],hits=[];
  const onFile=async(f,p,handle)=>{if(scanRun.abort)throw new Error('aborted');scanRun.scanned++;scanRun.currentFile=p;if(scanRun.scanned%50===0)renderScanUI();
    const res=await scanFileObj(f,p);if(!res)return;
    if(res.sev!=='low'&&res.verdict!=='无威胁'){scanRun.found++;threats.push(res);handleMap[p]=handle;if(hits.length<60)hits.push(res);}
    else if(scanRun.mode==='custom'&&res.verdict==='无威胁'&&res.rules.length===0){}
  };
  renderScanUI();
  try{
    if(mode==='demo'){await demoScan(threats);}
    else{
      if(window.showDirectoryPicker&&window.isSecureContext!==false){const dir=await window.showDirectoryPicker({mode:'read'});scanRun.path=dir.name;await scanDirHandle(dir,dir.name,onFile);}
      else{throw new Error('no-picker');}
    }
    if(scanRun.abort){scanRun.status='aborted';return finishScan();}
    scanRun.status='done';
  }catch(e){
    if(scanRun.abort){scanRun.status='aborted';}
    else{scanRun.status='error';scanRun.err=e.message||String(e);}
    if(e.message==='no-picker'||e.name==='AbortError'){if(e.name!=='AbortError')toast('当前环境不支持目录选择，已切换为演示扫描','warn');scanRun.status='error';scanRun.err='env';}
  }
  return finishScan();
}
async function demoScan(threats){const seed=(s)=>{let x=s*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280;};};const rnd=seed(20260915);
  const total=28000+Math.floor(rnd()*4000);scanRun.total=total;
  const dirs=['Windows','System32','Users','Program Files','Downloads','Documents','Temp','AppData','USB_DRIVE','Recycle.Bin'];
  const names=['svchost','winlogon','rundll32','explorer','chrome','update_installer','invoice_2026','report_final','photo_','setup','backup','data','config','module','driver','payload','trojan','crypto_miner','crack','keygen','resume','salary'];
  for(let i=0;i<total;i++){if(scanRun.abort)throw new Error('aborted');scanRun.scanned=i+1;scanRun.currentFile=`C:\\${dirs[i%dirs.length]}\\${names[(i*7+3)%names.length]}${(i%97)+1}.${['exe','dll','sys','js','vbs','docx','xlsm','pdf','png','zip','tmp'][i%11]}`;
    if(i%120===0)renderScanUI();
    if(i%237===0){const th={name:'威胁样本_'+i,path:scanRun.currentFile,size:120000+i*73,hash:'7a'+Math.floor(Math.random()*1e15).toString(16)+'...',time:Date.now(),verdict:['木马','勒索软件','挖矿程序','脚本病毒','蠕虫'][i/237%5|0],sev:['high','crit','high','med','med'][i/237%5|0],score:55+ (i/237%3)*20,rules:[{name:'演示样本特征'}],demo:true,id:uid()};threats.push(th);scanRun.found++;if(i%237===0&&false){}}
    await new Promise(r=>setTimeout(r,0));}
  scanRun.total=total;
}
function finishScan(){const s=scanRun;const dur=((Date.now()-s.start)/1000).toFixed(0)+' 秒';
  if(s.status==='done'){const rec={id:'SC-'+String(9000+Math.random()*999|0),type:s.mode==='demo'?'演示扫描':s.mode==='quick'?'快速扫描':s.mode==='full'?'全面扫描':'自定义扫描',mode:'实时',time:Date.now(),dur,files:s.scanned,threats:s.found,result:s.found>0?`发现 ${s.found} 个威胁`:'未发现威胁',path:s.path};store.scanHist.unshift(rec);save();audit('扫描完成',`${rec.type} ${rec.path}：${s.scanned} 个文件，${s.found} 个威胁`);}
  if(s.status==='done'&&s.found>0){const sev=s.found>2?'warn':'info';toast(`扫描完成：发现 ${s.found} 个威胁，已自动隔离`,`${sev}`);}
  if(s.status==='error'&&s.err!=='env'){toast('扫描失败：'+s.err,'err');}

function abortScan(){if(scanRun&&scanRun.status==='running'){scanRun.abort=true;toast('正在停止扫描…','warn');}}
function renderScanUI(){const el=$('#scanBox');if(!el||!scanRun)return;const s=scanRun;

    <div class="scan-stat"><div class="v">${Math.floor(pct*100)}%</div><div class="l">进度</div></div>
    <div class="scan-stat"><div class="v">${((Date.now()-s.start)/1000).toFixed(0)}s</div><div class="l">已用时间</div></div>

  <div class="flex mt16" style="justify-content:center"><button class="btn btn-danger" id="btnAbortScan">${I.pause} 停止扫描</button></div>`;}
  else if(s.status==='done'){

function genEicar(){const s='X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*';download('eicar_test.txt',s,'text/plain');audit('测试',`生成 EICAR 测试文件`);toast('EICAR 测试文件已生成，请保存后扫描检测','ok');}

/* ================= 静态沙箱分析 ================= */
const MITRE_MAP={EICAR:['T1036'],PACKED:['T1027.002'],INJECT:['T1055.001'],KEYLOG:['T1056.001'],ANTIDBG:['T1622'],HENT:['T1027'],RANSOM:['T1486','T1490'],MINER:['T1496'],SCRIPT:['T1059.001','T1059.003'],SPY:['T1056.001'],MACRO:['T1566.001','T1059.005'],AUTORUN:['T1547.001'],DBLEXT:['T1036.003'],PHISH:['T1566.002']};
function sandboxAnalyze(file){return new Promise(async(res)=>{const buf=await readHead(file);if(!buf){res({error:'无法读取文件'});return;}const hash=await sha256(buf);const r=analyzeBuf(buf,file.name);
  const behav=[];
  if(r.rules.some(x=>x.id==='EICAR'))behav.push({t:'0.0s',a:'文件被打开',d:'标准测试特征命中，触发静态引擎告警'});
  if(r.rules.some(x=>x.id==='SCRIPT')){behav.push({t:'0.4s',a:'脚本解释器启动',d:'wscript/powershell 尝试执行危险命令'},{t:'0.9s',a:'网络下载',d:'DownloadString 发起外联请求'},{t:'1.4s',a:'载荷执行',d:'从内存执行下载的载荷（无文件落地）'});}
  if(r.rules.some(x=>x.id==='INJECT')){behav.push({t:'0.3s',a:'打开目标进程',d:'OpenProcess 获取 explorer.exe 句柄'},{t:'0.8s',a:'写入远程内存',d:'VirtualAllocEx + WriteProcessMemory'},{t:'1.2s',a:'创建远程线程',d:'CreateRemoteThread 执行 Shellcode'});}
  if(r.rules.some(x=>x.id==='RANSOM')){behav.push({t:'0.2s',a:'枚举文件',d:'遍历文档目录 1200+ 文件'},{t:'1.1s',a:'批量加密',d:'以 .lock 扩展名重写文件内容'},{t:'1.6s',a:'删除卷影副本',d:'vssadmin delete shadows /all'},{t:'2.2s',a:'投放勒索说明',d:'写入 RYUK_README.txt'});}
  if(r.rules.some(x=>x.id==='MINER')){behav.push({t:'0.5s',a:'矿池握手',d:'连接 stratum+tcp://pool.xmr.tw:443'},{t:'1.3s',a:'占用 CPU',d:'挖矿线程占用 92% 计算资源'});}
  if(r.rules.some(x=>x.id==='MACRO')){behav.push({t:'0.1s',a:'宏自动执行',d:'AutoOpen 宏触发'},{t:'0.7s',a:'释放载荷',d:'解压内嵌 PE 至 %TEMP%'});}
  if(behav.length===0)behav.push({t:'0.0s',a:'无恶意行为',d:'未观察到可疑系统调用与网络行为'});
  const techs=[...new Set(r.rules.flatMap(x=>MITRE_MAP[x.id]||[]))];
  res({name:file.name,size:file.size,hash,entropy:r.entropy,verdict:r.verdict,sev:r.sev,score:r.score,rules:r.rules,behav,techs,time:Date.now(),pe:r.pe});});}
</script>

function startScan(mode,pathInput){if(store.page!=='protection'){go('protection','scan');setTimeout(()=>startScan(mode,pathInput),60);return;}
  if(mode==='real'){if(!REAL){toast('请安装 Windows 版使用真实扫描','warn');return;}realScanReal(pathInput||'quick');return;}
  if(mode==='custom'){if(window.showDirectoryPicker){realScan('custom');}else{toast('当前环境不支持目录选择，已使用演示扫描','warn');realScan('demo');}return;}
  if(mode==='quick'){store.scanState={mode:'demo'};toast('快速扫描已启动（演示数据）','info');realScan('demo');return;}
  if(mode==='full'){toast('全面扫描已启动（演示数据）','info');realScan('demo');return;}
  if(mode==='usb'){toast('U盘扫描已启动（演示数据）','info');realScan('demo');return;}
  if(mode==='offline'){toast('离线扫描已启动（演示数据）','info');realScan('demo');return;}
  if(mode==='schedule'){toast('已保存定时扫描计划：每日 02:00','ok');audit('计划任务','设置定时扫描 每日 02:00');return;}
  realScan(mode);
}

function bindPrivacy(){
  $('#camTgl').onclick=()=>privacyToggle('cam',!store.privacy.cam);
  $('#micTgl').onclick=()=>privacyToggle('mic',!store.privacy.mic);
  $('#camPreview').onclick=()=>camBlockShow();
  $('#micPreview').onclick=()=>micAlarmStart();
  const ms=$('#micStop');if(ms)ms.onclick=()=>micAlarmStop();
  const hb=$('#camHideBlock');if(hb)hb.onclick=()=>camBlockHide();
  $$('#camUsedBox [data-killcam]').forEach(el=>el.onclick=async()=>{
    const u=store.privacy.camUsed[+el.dataset.killcam];
    if(u&&confirm('终止程序「'+u.name+'」？')){const r=await window.depk.privacyKill(u.name);toast(r.ok&&r.data&&r.data.killed&&r.data.killed.length?('已终止：'+r.data.killed.join('、')):'未找到可终止进程（已系统级拒绝）','ok');privacyRefresh();}
  });
  $$('#micUsedBox [data-killmic]').forEach(el=>el.onclick=async()=>{
    const u=store.privacy.micUsed[+el.dataset.killmic];
    if(u&&confirm('终止程序「'+u.name+'」？')){const r=await window.depk.privacyKill(u.name);toast(r.ok&&r.data&&r.data.killed&&r.data.killed.length?('已终止：'+r.data.killed.join('、')):'未找到可终止进程（已系统级拒绝）','ok');privacyRefresh();}
  });
  if(REAL)privacyRefresh();
}
async function privacyToggle(dev,on){
  const d=dev==='cam'?'webcam':'microphone';
  store.privacy[dev]=on?1:0;save();renderPrivacy();
  if(REAL&&window.depk.privacySet){
    const r=await window.depk.privacySet(d,on);
    if(r&&r.ok&&r.data){
      const hk=r.data.machine?'系统级':'当前用户级';
      toast(on?('已阻止'+d+'访问（'+hk+'）'):'已恢复'+d+'访问','ok');
      if(on&&d==='webcam'&&store.privacy.camInUse)camBlockShow();
      if(on&&d==='microphone'&&store.privacy.micInUse)micAlarmStart();
    }else toast('设置失败：'+(r&&r.err||'未知错误'),'err');
  }else{toast('浏览器预览：开关已记录（安装版为系统级生效）','ok');}
  privacyRefresh();
}
async function privacyRefresh(){
  if(!REAL||!window.depk.privacyGetStatus)return;
  const r=await window.depk.privacyGetStatus();
  if(!r||!r.ok||!r.data)return;
  const w=r.data.webcam,m=r.data.microphone;
  const camUsed=(w.used||[]).map(u=>({name:u.name,inUse:!!u.inUse}));
  const micUsed=(m.used||[]).map(u=>({name:u.name,inUse:!!u.inUse}));
  const prevCamIn=store.privacy.camInUse,prevMicIn=store.privacy.micInUse;
  store.privacy.camUsed=camUsed;store.privacy.micUsed=micUsed;
  store.privacy.camInUse=camUsed.some(u=>u.inUse);
  store.privacy.micInUse=micUsed.some(u=>u.inUse);
  const $=s=>document.querySelector(s);
  if($('#camInUse'))$('#camInUse').innerHTML=store.privacy.camInUse?'<b style="color:var(--red)">正在被调用</b>':'无';
  if($('#micInUse'))$('#micInUse').innerHTML=store.privacy.micInUse?'<b style="color:var(--red)">正在被调用</b>':'无';
  if($('#camVal'))$('#camVal').textContent=(w.master==='Deny')?'已阻止 (Deny)':'允许 (Allow)';
  if($('#micVal'))$('#micVal').textContent=(m.master==='Deny')?'已阻止 (Deny)':'允许 (Allow)';
  if(store.privacy.cam&&store.privacy.camInUse&&!prevCamIn)camBlockShow();
  if(store.privacy.mic&&store.privacy.micInUse&&!prevMicIn)micAlarmStart();
  if(!store.privacy.micInUse&&prevMicIn)micAlarmStop();
  if(!store.privacy.camInUse&&prevCamIn)camBlockHide();
}
function camBlockShow(){
  const el=$('#camBlock');if(!el)return;
  el.style.display='flex';
  if(!store._camEsc){store._camEsc=true;document.addEventListener('keydown',e=>{if(e.key==='Escape')camBlockHide();});}
}
function camBlockHide(){
  const el=$('#camBlock');if(el)el.style.display='none';
}
let _micAudio=null;
function micAlarmStart(){
  const bar=$('#micAlarmBar');if(bar)bar.style.display='flex';
  const st=$('#micStop');if(st)st.style.display='';
  if(_micAudio)return;
  try{
    if(typeof DEPK_WARN_AUDIO!=='string'||!DEPK_WARN_AUDIO)throw new Error('无语音素材');
    const bin=atob(DEPK_WARN_AUDIO),u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    _micAudio=new Audio(URL.createObjectURL(new Blob([u8],{type:'audio/wav'})));
    _micAudio.loop=true;_micAudio.play().catch(()=>{});
  }catch(e){toast('无法播放警示语音：'+e.message,'err');}
}
function micAlarmStop(){
  const bar=$('#micAlarmBar');if(bar)bar.style.display='none';
  const st=$('#micStop');if(st)st.style.display='none';
  if(_micAudio){_micAudio.pause();_micAudio=null;}
}

function sandRun(file){
  $('#sandReport').innerHTML=`<div class="flex col" style="align-items:center;gap:12px;padding:60px 0"><div class="scan-ring running"><span class="sr-ico">${I.radar}</span></div><div style="font-size:13px">正在分析 <b>${esc(file.name)}</b>…</div><div style="font-size:11.5px;color:var(--text-3)">特征匹配 · PE 解析 · 熵值计算 · 行为模拟</div></div>`;
  setTimeout(async()=>{
    const r=await sandboxAnalyze(file);if(!r){$('#sandReport').innerHTML='<div class="empty">分析失败</div>';return;}
    audit('沙箱分析',`分析 ${file.name} → ${r.verdict} (${r.score}分)`);
    const color=r.sev==='crit'?'#f44b5a':r.sev==='high'?'#ff7a45':r.sev==='med'?'#f5b82e':'#35c759';
    const sevTxt=r.sev==='crit'?'严重':r.sev==='high'?'高危':r.sev==='med'?'中危':'安全';
    $('#sandReport').innerHTML=`
    <div class="flex" style="justify-content:center;padding:8px 0"><div id="sandScore"></div></div>
    <div style="text-align:center;margin-top:6px"><span class="pill ${r.sev==='crit'?'red':r.sev==='high'?'amber':r.sev==='med'?'blue':'green'}" style="font-size:12px">${sevTxt} · ${esc(r.verdict)}</span></div>
    <div class="kv mt12"><span class="k">文件名</span><span class="v">${esc(r.name)}</span></div>
    <div class="kv"><span class="k">文件大小</span><span class="v">${fmtSize(r.size)}</span></div>
    <div class="kv"><span class="k">SHA-256</span><span class="v mono" style="font-size:10px">${esc(r.hash)}</span></div>
    <div class="kv"><span class="k">熵值</span><span class="v">${r.entropy.toFixed(2)} / 8（${r.entropy>7.2?'偏高，疑似加密/混淆':'正常'}）</span></div>
    <div class="kv"><span class="k">PE 结构</span><span class="v">${r.pe?`${r.pe.is64?'PE32+':'PE32'} · ${r.pe.secs.length} 节区 · ${r.pe.dlls.length} 个 DLL`:'非 PE 文件'}</span></div>
    <div class="card-title mt16">命中规则 (${r.rules.length})</div>
    ${r.rules.length?r.rules.map(x=>`<div class="list-item"><span class="sev ${x.sev==='crit'?'crit':x.sev==='high'?'high':x.sev==='med'?'med':'info'}"></span><div class="grow"><div style="font-size:12.5px;font-weight:600">${esc(x.name)} <span class="tag">${esc(x.type)}</span></div><div style="font-size:11px;color:var(--text-3)">${esc(x.desc)}</div></div><span class="num" style="font-weight:700;color:${x.score>70?'var(--red)':x.score>45?'var(--amber)':'var(--text-3)'}">${x.score}</span></div>`).join(''):`<div class="empty" style="padding:20px">${I.shieldck}<div>未命中任何恶意特征</div></div>`}
    <div class="card-title mt16">模拟行为链</div>
    <div class="timeline">${r.behav.map(b=>`<div class="tl-item ${r.sev==='crit'?'crit':r.sev==='high'?'high':'low'}"><div class="tl-time">${b.t}</div><div class="tl-title">${esc(b.a)}</div><div class="tl-desc">${esc(b.d)}</div></div>`).join('')}</div>
    ${r.techs.length?`<div class="card-title mt16">MITRE ATT&CK</div><div class="attr-map">${r.techs.map(t=>`<span class="a">${t}</span>`).join('')}</div>`:''}
    <div class="flex mt16" style="gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary btn-sm" id="sandDl">${I.download} 下载报告</button>
      ${r.sev!=='low'?`<button class="btn btn-danger btn-sm" id="sandQuar">${I.lock} 加入隔离区</button>`:''}
      <button class="btn btn-secondary btn-sm" id="sandTrust">${I.check} 加入信任</button>
    </div>`;
    scoreRing('#sandScore',r.score,color);
    $('#sandDl').onclick=()=>download(`沙箱报告_${file.name}.json`,JSON.stringify({name:r.name,size:r.size,hash:r.hash,entropy:r.entropy,verdict:r.verdict,severity:sevTxt,score:r.score,rules:r.rules.map(x=>x.name),behaviors:r.behav,mitre:r.techs,time:fmtDT()},null,2),'application/json');
    if($('#sandQuar'))$('#sandQuar').onclick=async()=>{const buf=await readHead(file);if(buf){await qAdd({name:file.name,path:'(沙箱提交) '+file.name,size:file.size,hash:r.hash,time:Date.now(),verdict:r.verdict,sev:r.sev,engine:'沙箱分析'},buf);toast('已加入隔离区（加密副本）','ok');}};
    $('#sandTrust').onclick=()=>{store.exclusions.push({id:uid(),type:'文件',target:file.name,scope:'实时保护 + 扫描'});save();toast('已加入信任列表','ok');};
  },900);
}

/* ================= 真实扫描（Windows 原生引擎） ================= */
function realScanReal(pm){
  if(store.page!=='protection'){go('protection','scan');setTimeout(()=>realScanReal(pm),60);return;}
  scanRun={mode:'真实扫描',path:'',status:'running',scanned:0,found:0,total:0,start:Date.now(),currentFile:'',abort:false,real:true};
  renderScanUI();
  (async()=>{
    const pathInput=document.getElementById('realScanPath');
    const root=(pm==='quick'||!pathInput||!pathInput.value.trim())?null:pathInput.value.trim();
    const iv=setInterval(()=>renderScanUI(),700);
    try{
      const res=await window.depk.scanDir(root);
      clearInterval(iv);
      scanRun.scanned=res.files;scanRun.found=res.threats.length;scanRun.total=res.files;scanRun.path=res.root||'';scanRun.durReal=res.dur;
      store.lastRealScan={...res,time:Date.now()};
      let qCount=0;
      for(const t of res.threats.slice(0,25)){try{const q=await window.depk.quarantineFile(t.path,t.verdict);if(q&&q.ok){t.qid=q.id;t.quarantined=true;qCount++;}}catch(e){}}
      save();
      audit('真实扫描',`${res.root}：${res.files} 文件，${res.threats.length} 威胁，隔离 ${qCount}`);
      scanRun.status='done';
      if(res.threats.length)toast(`真实扫描完成：发现 ${res.threats.length} 个威胁，已隔离 ${qCount} 个文件`,'warn');
      else toast('真实扫描完成：未发现威胁','ok');
    }catch(err){clearInterval(iv);scanRun.status='error';scanRun.err=String(err&&err.message||err);}
    renderScanUI();
    if(store.page==='protection')renderView();
    if(store.tab==='quar')rProtQuar();
  })();
}

async function uninsScanResidual(name,loc){
  if(!REAL){toast('需 Windows 版','warn');return;}
  toast('正在扫描残留…','info');
  const r=await window.depk.scanResidual(name,loc);
  const items=r.ok?(r.data||[]):[];
  const totalReg=items.filter(x=>x.type==='reg').length, totalFile=items.filter(x=>x.type==='file').length;
  modal(`<div style="max-height:440px;overflow-y:auto">
    <div class="mb12" style="font-size:12.5px;color:var(--text-2)">找到 <b style="color:var(--amber)">${items.length}</b> 项残留（注册表 ${totalReg} · 文件 ${totalFile}）。勾选后点击删除。</div>
    ${items.length?`<div class="mb12"><label style="display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="resAll" style="width:15px;height:15px"> 全选</label></div>
    <div id="resList">${items.map((x,i)=>`<div class="list-item" style="align-items:center"><input type="checkbox" class="res-chk" data-i="${i}" style="width:15px;height:15px;flex:none"><span class="sev ${x.type==='reg'?'amber':'blue'}"></span><div class="grow"><div class="mono" style="font-size:11px;word-break:break-all">${esc(x.path)}</div><div style="font-size:10.5px;color:var(--text-3)">${x.type==='reg'?'注册表项':'文件'+(x.size?' · '+fmtSize(x.size):'')}</div></div></div>`).join('')}</div>`
    :`<div class="empty" style="padding:26px">${I.check}<div>未发现残留，程序清理得很干净</div></div>`}</div>`,
  {title:'残留扫描 - '+name,okTxt:items.length?'删除选中项':'关闭',showCancel:!!items.length,onOk:async()=>{
      if(!items.length)return;
      const sel=[...document.querySelectorAll('.res-chk:checked')].map(c=>items[Number(c.dataset.i)].path);
      if(!sel.length){toast('未选择任何项','warn');return false;}
      confirmDlg('删除残留','将永久删除选中的 '+sel.length+' 项残留（注册表项/文件），此操作不可撤销。确认？',async()=>{const d=await window.depk.deleteResidual(sel);toast('已删除 '+d.deleted+' 项残留','ok');audit('卸载工具','删除残留 '+name+' ('+d.deleted+' 项)');},'删除');
    }});
  const all=document.getElementById('resAll');if(all)all.onchange=()=>{document.querySelectorAll('.res-chk').forEach(c=>c.checked=all.checked);};
}
/* ================= 动态沙盒（Windows 版） ================= */
async function dynSandboxRun(samplePath){
  const box=document.getElementById('dynReport');if(!box)return;
  const secs=Number((document.getElementById('dynSecs')||{}).value||8);
  box.innerHTML=`<div class="dyn-load"><div class="scan-ring running" style="width:36px;height:36px;border-width:2px"><span class="sr-ico" style="width:14px;height:14px">${I.scan}</span></div><div style="font-size:12px;color:var(--text-2)">正在受限运行样本并采集行为（最长 ${secs} 秒）…</div></div>`;
  audit('动态沙盒',`运行样本 ${samplePath}（${secs} 秒）`);
  try{
    const r=await window.depk.dynSandbox(samplePath,secs);
    if(!r||!r.ok){box.innerHTML=`<div class="empty" style="padding:24px 12px">${I.warn}<div style="font-size:12px">动态分析失败：${esc(r&&r.err||'未知错误')}</div></div>`;return;}
    const procs=(r.procs||[]),files=(r.files||[]),conns=(r.conns||[]),events=(r.events||[]);
    box.innerHTML=`
    <div class="grid-3" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">
      <div class="card kpi" style="padding:10px"><div><div class="k-val" style="font-size:15px">${procs.length+1}</div><div class="k-lbl">进程（含主进程）</div></div></div>
      <div class="card kpi" style="padding:10px"><div><div class="k-val" style="font-size:15px;color:${conns.length?'var(--red)':'var(--green)'}">${conns.length}</div><div class="k-lbl">外联连接</div></div></div>
      <div class="card kpi" style="padding:10px"><div><div class="k-val" style="font-size:15px;color:${files.length?'var(--amber)':'var(--green)'}">${files.length}</div><div class="k-lbl">写入文件</div></div></div>
    </div>
    ${events.length?`<div class="mb12" style="font-size:11.5px;color:var(--text-2)">${events.map(e=>'· '+esc(e)).join('<br>')}</div>`:''}
    ${procs.length?`<div style="font-size:12px;font-weight:600;margin:8px 0 4px">子进程</div><div class="table-wrap"><table class="tbl"><colgroup><col style="width:12%"><col style="width:22%"><col style="width:14%"><col style="width:34%"><col style="width:18%"></colgroup><thead><tr><th>PID</th><th>名称</th><th>父PID</th><th>路径</th><th>时间</th></tr></thead><tbody>${procs.map(p=>'<tr><td class="num">'+p.pid+'</td><td>'+esc(p.name)+'</td><td class="num">'+p.parent+'</td><td class="mono" style="font-size:10px">'+esc(p.path||'—')+'</td><td style="font-size:11px">'+esc(p.time)+'</td></tr>').join('')}</tbody></table></div>`:''}
    ${conns.length?`<div style="font-size:12px;font-weight:600;margin:8px 0 4px">外联连接</div><div class="flex" style="flex-wrap:wrap;gap:6px">${conns.map(c=>'<span class="pill red">'+esc(c)+'</span>').join('')}</div>`:'<div class="mt8" style="font-size:11.5px;color:var(--green)">'+I.check+' 未观察到外联连接</div>'}
    ${files.length?`<div style="font-size:12px;font-weight:600;margin:8px 0 4px">写入文件</div><div class="mono" style="font-size:10.5px;color:var(--text-2);word-break:break-all">${files.map(f=>esc(f)).join('<br>')}</div>`:'<div class="mt8" style="font-size:11.5px;color:var(--green)">'+I.check+' 沙盒目录内未发现新增文件</div>'}
    <div class="mt12" style="font-size:11px;color:var(--text-3)">动态沙盒结论：${conns.length||files.length||procs.length?'存在可疑行为（外联/写文件/衍生进程），建议结合静态报告综合研判':'未观察到明显恶意行为'}</div>`;
    toast('动态沙盒分析完成','ok');
  }catch(err){
    box.innerHTML=`<div class="empty" style="padding:24px 12px">${I.warn}<div style="font-size:12px">动态分析异常：${esc(String(err&&err.message||err))}</div></div>`;
  }
}

function render(){renderView();}

/* ================= 启动 ================= */
function init(){
  load();idb.open().then(loadQuar).catch(()=>{});
  applyTheme();
  $('#btnTheme').onclick=()=>{store.theme=store.theme==='dark'?'light':'dark';save();applyTheme();};
  $('#btnNotif').onclick=()=>showNotifs();
  $('#btnScanNow').onclick=()=>startScan('quick');
  const mcb=$('#micAlarmClose');if(mcb)mcb.onclick=()=>micAlarmStop();
  setInterval(()=>{if(store.page==='privacy'&&store.privacy&&(store.privacy.cam||store.privacy.mic))privacyRefresh();},5000);
  if(REAL&&window.depk.onWatchEvent){window.depk.onWatchEvent(d=>{store.watchEvents.unshift(d);if(store.watchEvents.length>200)store.watchEvents.length=200;if(store.page==='local'&&store.tab==='watch')renderLocal();});}
  if(store.audit.length===0){audit('系统启动','DEPK Security Assistant 初始化完成');audit('登录','管理员通过 MFA 登录控制台');}
  renderView();
  setTimeout(()=>{toast('欢迎使用 DEPK Security Assistant，您的设备已受到保护','ok');},600);
}
function showNotifs(){
  modal(`<div style="max-height:420px;overflow-y:auto">${store.notifs.map(n=>`<div class="notif-item"><div class="ni-ico" style="background:${n.c==='red'?'var(--red-soft)':n.c==='amber'?'var(--amber-soft)':'var(--accent-soft)'};color:${n.c==='red'?'var(--red)':n.c==='amber'?'var(--amber)':'var(--accent)'}">${I[n.icon]}</div>
  <div><div style="font-size:13px;font-weight:600">${esc(n.title)}</div><div style="font-size:11.5px;color:var(--text-3);margin-top:2px">${esc(n.desc)}</div><div style="font-size:10.5px;color:var(--text-4);margin-top:4px">${relT(n.t)}</div></div></div>`).join('')}</div>`,
  {title:'通知中心 ('+store.notifs.length+')',okTxt:'全部标为已读',showCancel:false,onOk:null});
}
init();
</script>

<!-- ===== 隐私防护：摄像头警示层（对方视角） ===== -->
<div id="camBlock" style="display:none;position:fixed;inset:0;z-index:999999;background:#000;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:default;user-select:none">
  <div style="width:56px;height:56px;border-radius:50%;border:2px solid #ff2d2d;display:flex;align-items:center;justify-content:center;margin-bottom:22px;animation:camPulse 1.2s ease-in-out infinite">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#ff2d2d" stroke-width="2"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/><path d="M4 4L20 20" stroke-linecap="round"/></svg>
  </div>
  <div style="color:#ff2d2d;font-size:44px;font-weight:800;letter-spacing:6px;line-height:1.3" id="camBlockTxt">您已违法违规操作</div>
  <div style="color:rgba(255,255,255,.5);font-size:15px;margin-top:18px;letter-spacing:3px">摄像头访问已被 DEPK 安全防护阻止</div>
  <div style="color:rgba(255,255,255,.25);font-size:11.5px;margin-top:26px;letter-spacing:1px">DEPK SECURITY ASSISTANT · PRIVACY SHIELD</div>
</div>
<div id="micAlarmBar" style="display:none;position:fixed;left:16px;bottom:16px;z-index:999998;background:rgba(0,0,0,.88);border:1px solid rgba(255,45,45,.33);border-radius:12px;padding:10px 16px;align-items:center;gap:10px;font-size:12.5px;color:#ff8a8a;box-shadow:0 8px 32px rgba(0,0,0,.5)">
  <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff2d2d;animation:camPulse 1s infinite"></span>
  <span>麦克风警示语音播放中（您已违法违规操作）</span>
  <button id="micAlarmClose" style="background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:16px;line-height:1" title="停止播放">×</button>
</div>
<style>
@keyframes camPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.08)}}
</style>
</body>
