<script>
/* ================= 本机管理（真实系统数据 · 仅 Windows 版可用） ================= */
const LOC_TABS=[{id:'proc',l:'进程管理'},{id:'startup',l:'启动项'},{id:'net',l:'网络连接'},{id:'sys',l:'系统信息'},{id:'soft',l:'软件清单'},{id:'unins',l:'卸载工具'},{id:'watch',l:'实时监控'}];
function renderLocal(){
  const tab=store.tab||'proc';
  $('#tbTitle').textContent='本机管理';$('#tbCrumb').textContent='真实系统数据 · '+(REAL?'原生引擎已连接':'需 Windows 版');
  $('#viewInner').innerHTML=`<div class="view-fade"><div class="pagerow">${tabBar(LOC_TABS,tab,'local')}</div>${REAL?'':'<div class="card mb16" style="border-color:var(--amber)"><b style="color:var(--amber)">浏览器预览模式：</b><span style="color:var(--text-2)">本页真实系统数据仅 Windows 安装版可用，请运行「DEPK Security Assistant.exe」。</span></div>'}
  <div id="locBody"></div></div>`;
  bindTabs('#viewInner','local');
  if(!REAL){$('#locBody').innerHTML=`<div class="empty">${I.monitor}<div>安装 Windows 版后，此处将展示本机真实进程、启动项、网络连接、系统信息与软件清单</div></div>`;return;}
  ({proc:rLocProc,startup:rLocStartup,net:rLocNet,sys:rLocSys,soft:rLocSoft,unins:rLocUnins,watch:rLocWatch}[tab])();
}
function locLoading(){return `<div class="flex" style="gap:12px;align-items:center;padding:40px 0;justify-content:center"><div class="scan-ring running" style="width:44px;height:44px;border-width:2px"><span class="sr-ico" style="width:18px;height:18px">${I.refresh}</span></div><span style="color:var(--text-3);font-size:13px">正在读取本机数据…</span></div>`;}
function rLocProc(){
  $('#locBody').innerHTML=`<div class="flex mb16" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
    <div class="flex" style="gap:8px"><button class="btn btn-primary btn-sm" id="procRefresh">${I.refresh} 刷新进程</button><span class="stat-chip" id="procCount" style="border-color:var(--border-2)">—</span><span class="stat-chip" style="border-color:var(--border-2)">终止进程需管理员权限</span></div>
    <input placeholder="搜索进程名…" id="procSearch" style="width:200px"></div>
  <div id="procBox">${locLoading()}</div>`;
  $('#procRefresh').onclick=loadProc;$('#procSearch').oninput=()=>drawProc(store.procs||[]);
  loadProc();
}
async function loadProc(){
  const r=await window.depk.getProcesses();
  if(!r.ok){$('#procBox').innerHTML=`<div class="empty">读取失败：${esc(r.err)}</div>`;return;}
  store.procs=r.data;$('#procCount').textContent=r.data.length+' 个进程';drawProc(r.data);
}
function drawProc(list){
  const q=($('#procSearch')&&$('#procSearch').value||'').toLowerCase();
  const rows=list.filter(p=>!q||p.name.toLowerCase().includes(q));
  $('#procBox').innerHTML=`<div class="table-wrap"><table class="tbl"><colgroup><col style="width:14%"><col style="width:9%"><col style="width:10%"><col style="width:12%"><col style="width:30%"><col style="width:15%"><col style="width:10%"></colgroup>
  <thead><tr><th>进程名</th><th>PID</th><th>CPU(s)</th><th>内存</th><th>可执行路径</th><th>启动时间</th><th>操作</th></tr></thead>
  <tbody>${rows.map(p=>`<tr><td style="font-weight:600">${esc(p.name)}</td><td class="num">${p.pid}</td><td class="num">${p.cpu!=null?p.cpu:'—'}</td><td class="num">${fmtSize(p.mem)}</td><td class="mono" style="font-size:10.5px">${esc(p.path||'（系统进程）')}</td><td style="font-size:11px;color:var(--text-3)">${esc(p.start||'—')}</td><td><button class="btn btn-danger btn-sm" data-kill="${p.pid}" data-name="${esc(p.name)}">终止</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--text-3)">无匹配进程</td></tr>'}</tbody></table></div>`;
  $$('#procBox [data-kill]').forEach(b=>b.onclick=()=>confirmDlg('终止进程',`确认终止进程 <b>${b.dataset.name}</b> (PID ${b.dataset.kill})？该操作不可撤销。`,async()=>{const r=await window.depk.killProcess(b.dataset.kill);if(r.ok){toast('进程已终止','ok');audit('进程管理',`终止进程 ${b.dataset.name} (${b.dataset.kill})`);loadProc();}else{toast('终止失败：'+r.err,'err');}},'终止'));}
function rLocStartup(){
  $('#locBody').innerHTML=`<div class="flex mb16" style="gap:8px"><button class="btn btn-primary btn-sm" id="stRefresh">${I.refresh} 刷新启动项</button><span class="stat-chip" style="border-color:var(--border-2)">读取注册表 Run 键（HKCU/HKLM）</span></div><div id="stBox">${locLoading()}</div>`;
  $('#stRefresh').onclick=loadStartup;loadStartup();
}
async function loadStartup(){
  const r=await window.depk.getStartup();
  $('#stBox').innerHTML=!r.ok?`<div class="empty">读取失败：${esc(r.err)}</div>`:
  (r.data.length?`<div class="table-wrap"><table class="tbl"><colgroup><col style="width:20%"><col style="width:60%"><col style="width:10%"><col style="width:10%"></colgroup>
  <thead><tr><th>名称</th><th>命令</th><th>注册表</th><th>建议</th></tr></thead>
  <tbody>${r.data.map(s=>`<tr><td style="font-weight:600">${esc(s.name)}</td><td class="mono" style="font-size:11px">${esc(s.command)}</td><td><span class="tag">${s.hive}</span></td><td><span class="pill ${/powershell|cmd|mshta|regsvr32|wscript|cscript|https?:|temp/i.test(s.command)?'amber':'green'}">${/powershell|cmd|mshta|regsvr32|wscript|cscript|https?:|temp/i.test(s.command)?'建议核查':'正常'}</span></td></tr>`).join('')}</tbody></table></div>`
  :`<div class="empty">${I.check}<div>未读取到启动项（可能权限受限，请以管理员运行）</div></div>`);
}
function rLocNet(){
  $('#locBody').innerHTML=`<div class="flex mb16" style="gap:8px"><button class="btn btn-primary btn-sm" id="netRefresh">${I.refresh} 刷新连接</button><span class="stat-chip" style="border-color:var(--border-2)">本机活动 TCP 连接（非监听）</span></div><div id="netBox">${locLoading()}</div>`;
  $('#netRefresh').onclick=loadNet;loadNet();
}
async function loadNet(){

}
function rLocSys(){
  $('#locBody').innerHTML=locLoading();
  (async()=>{
    const [si,dr]=await Promise.all([window.depk.getSysInfo(),window.depk.getDrives()]);
    const s=si.data;

    <div class="kpi-grid mb16">
      <div class="card kpi"><div class="k-ico" style="background:var(--accent-soft);color:var(--accent)">${I.cpu}</div><div><div class="k-val" style="font-size:17px">${esc(s.cpu||'—')}</div><div class="k-lbl">${s.cores} 核 ${s.threads} 线程 · ${esc(s.manufacturer)} ${esc(s.model)}</div></div></div>
      <div class="card kpi"><div class="k-ico" style="background:var(--green-soft);color:var(--green)">${I.db}</div><div><div class="k-val" style="font-size:17px">${fmtSize(s.totalMem)}</div><div class="k-lbl">物理内存 · 可用 ${fmtSize(s.freeMem)}</div></div></div>

      <div class="card kpi"><div class="k-ico" style="background:var(--purple-soft);color:var(--purple)">${I.clock}</div><div><div class="k-val" style="font-size:17px">${s.uptime} 小时</div><div class="k-lbl">已运行 · 上次启动 ${esc(s.boot||'—')}</div></div></div>
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-title">磁盘与可移动介质</div>
        ${dr.ok&&dr.data.length?`<div class="table-wrap"><table class="tbl"><colgroup><col style="width:14%"><col style="width:14%"><col style="width:18%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup>
        <thead><tr><th>盘符</th><th>类型</th><th>卷标</th><th>文件系统</th><th class="num">已用</th><th class="num">总容量</th></tr></thead>
        <tbody>${dr.data.map(d=>`<tr><td class="mono" style="font-weight:700">${d.letter}</td><td><span class="pill ${d.type==='可移动'?'amber':'blue'}">${d.type}</span></td><td>${esc(d.name||'—')}</td><td class="mono">${d.fs||'—'}</td><td class="num">${fmtSize(d.size-d.free)}</td><td class="num">${fmtSize(d.size)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">无法读取磁盘信息</div>'}
        <div class="mt12" style="font-size:11.5px;color:var(--text-3)">可移动介质（U盘）插入时，可在「病毒防护 → 扫描选项」选择对应盘符进行真实扫描。</div>
      </div>
      <div class="card"><div class="card-title">本机身份</div>
        <div class="kv"><span class="k">计算机名</span><span class="v">${esc(s.hostname)}</span></div>
        <div class="kv"><span class="k">当前用户</span><span class="v">${esc(s.user)}</span></div>
        <div class="kv"><span class="k">系统架构</span><span class="v">${esc(s.arch)}</span></div>
        <div class="kv"><span class="k">CPU</span><span class="v">${esc(s.cpu)}</span></div>
        <div class="kv"><span class="k">主板型号</span><span class="v">${esc(s.manufacturer)} ${esc(s.model)}</span></div>
        <button class="btn btn-secondary btn-sm mt12" id="sysRefresh">${I.refresh} 重新读取</button></div>
    </div>`;
    $('#sysRefresh').onclick=()=>rLocSys();
  })();
}
function rLocSoft(){
  $('#locBody').innerHTML=`<div class="flex mb16" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
    <div class="flex" style="gap:8px"><button class="btn btn-primary btn-sm" id="softRefresh">${I.refresh} 重新清点</button><span class="stat-chip" id="softCount" style="border-color:var(--border-2)">—</span><button class="btn btn-secondary btn-sm" id="softExp">${I.download} 导出 CSV</button></div>
    <input placeholder="搜索软件…" id="softSearch" style="width:220px"></div>
  <div id="softBox">${locLoading()}</div>`;
  $('#softRefresh').onclick=loadSoft;$('#softSearch').oninput=()=>drawSoft(store.soft||[]);
  $('#softExp').onclick=()=>{if(!store.soft)return;const rows=[['名称','版本','发布者']];store.soft.forEach(s=>rows.push([s.name,s.version,s.publisher]));download('软件清单.csv',rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');toast('软件清单已导出','ok');};
  loadSoft();
}
async function loadSoft(){
  const r=await window.depk.getSoftware();
  if(!r.ok){$('#softBox').innerHTML=`<div class="empty">读取失败：${esc(r.err)}</div>`;return;}
  store.soft=r.data;$('#softCount').textContent=r.count+' 个已安装应用';drawSoft(r.data);
}
function drawSoft(list){
  const q=($('#softSearch')&&$('#softSearch').value||'').toLowerCase();
  const rows=list.filter(s=>!q||s.name.toLowerCase().includes(q)||(s.publisher||'').toLowerCase().includes(q));
  $('#softBox').innerHTML=`<div class="table-wrap"><table class="tbl"><colgroup><col style="width:44%"><col style="width:20%"><col style="width:36%"></colgroup>
  <thead><tr><th>软件名称</th><th>版本</th><th>发布者</th></tr></thead>
  <tbody>${rows.map(s=>`<tr><td style="font-weight:600">${esc(s.name)}</td><td class="mono">${esc(s.version||'—')}</td><td style="color:var(--text-2)">${esc(s.publisher||'—')}</td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center;color:var(--text-3)">无匹配软件</td></tr>'}</tbody></table></div>`;

function rLocWatch(){
  const defDirs='下载 / 桌面 / 文档（本机用户目录）';
  $('#locBody').innerHTML=`
  <div class="grid-2">
    <div class="card"><div class="card-title">实时文件监控 <span class="sub">fs.watch 原生实现</span></div>
      <p style="font-size:12.5px;color:var(--text-2)">对指定目录进行实时文件变更监控（创建/修改/重命名/删除）。此功能真实有效，可与「病毒防护 → 实时保护」联动。</p>
      <div class="kv mt12"><span class="k">监控范围</span><span class="v">${defDirs}</span></div>
      <div class="kv"><span class="k">监控状态</span><span class="v" id="watchState" style="color:var(--red)">未启动</span></div>
      <div class="kv"><span class="k">已记录事件</span><span class="v" id="watchCount">0</span></div>
      <div class="flex mt12" style="gap:10px"><button class="btn btn-primary" id="watchOn">${I.play} 启动监控</button><button class="btn btn-secondary" id="watchOff">${I.pause} 停止</button></div>
      <div style="font-size:11px;color:var(--text-3);margin-top:10px">提示：先启动监控，再在监控目录中新建/修改文件，即可看到实时事件。</div>
    </div>
    <div class="card"><div class="card-title">监控事件流</div><div id="watchBox" style="max-height:420px;overflow-y:auto"><div class="empty">${I.eye}<div>启动监控后，文件变更将实时显示在这里</div></div></div></div>
  </div>`;
  $('#watchOn').onclick=async()=>{const r=await window.depk.watchStart([]);if(r.ok){store.watchState=true;$('#watchState').textContent='监控中';$('#watchState').style.color='var(--green)';toast('实时监控已启动（'+defDirs+'）','ok');}else toast('启动失败：'+r.err,'err');};
  $('#watchOff').onclick=async()=>{await window.depk.watchStop();store.watchState=false;$('#watchState').textContent='已停止';$('#watchState').style.color='var(--red)';toast('监控已停止','ok');};
  drawWatch();
}
function drawWatch(){
  const el=$('#watchBox');if(!el)return;
  const evs=store.watchEvents||[];$('#watchCount')&&($('#watchCount').textContent=evs.length);
  el.innerHTML=evs.length?evs.slice(0,80).map(e=>`<div class="list-item"><span class="sev ${e.evt==='delete'?'red':e.evt==='rename'?'amber':'green'}"></span><div class="grow"><div class="mono" style="font-size:11.5px">${esc(e.file)}</div><div style="font-size:10.5px;color:var(--text-3)">${esc(e.dir)} · ${relT(e.time)}</div></div><span class="pill ${e.evt==='delete'?'red':e.evt==='rename'?'amber':'green'}" style="font-size:10px">${e.evt}</span></div>`).join(''):'<div class="empty">${I.eye}<div>暂无事件</div></div>';
}

/* ================= 真实扫描（Windows 原生引擎） ================= */
function realScanReal(pm){
  if(store.page!=='protection'){go('protection','scan');setTimeout(()=>realScanReal(pm),60);return;}
  scanRun={mode:'真实扫描',path:'',status:'running',scanned:0,found:0,total:0,start:Date.now(),currentFile:'',abort:false,real:true};
  renderScanUI();
  (async()=>{
    const pathInput=document.getElementById('realScanPath');
    const root=(pm==='quick'||!pathInput||!pathInput.value.trim())?null:pathInput.value.trim();
    const iv=setInterval(()=>renderScanUI(),700);
    try{
      const res=await window.depk.scanDir(root);
      clearInterval(iv);
      scanRun.scanned=res.files;scanRun.found=res.threats.length;scanRun.total=res.files;scanRun.path=res.root||'';scanRun.durReal=res.dur;
      store.lastRealScan={...res,time:Date.now()};
      let qCount=0;
      for(const t of res.threats.slice(0,25)){try{const q=await window.depk.quarantineFile(t.path,t.verdict);if(q&&q.ok){t.qid=q.id;t.quarantined=true;qCount++;}}catch(e){}}
      save();
      audit('真实扫描',`${res.root}：${res.files} 文件，${res.threats.length} 威胁，隔离 ${qCount}`);
      scanRun.status='done';
      if(res.threats.length)toast(`真实扫描完成：发现 ${res.threats.length} 个威胁，已隔离 ${qCount} 个文件`,'warn');
      else toast('真实扫描完成：未发现威胁','ok');
    }catch(err){clearInterval(iv);scanRun.status='error';scanRun.err=String(err&&err.message||err);}
    renderScanUI();
    if(store.page==='protection')renderView();
    if(store.tab==='quar')rProtQuar();
  })();
}


/* ================= 卸载工具（Geek 风格） ================= */
function rLocUnins(){
  $('#locBody').innerHTML=`<div class="flex mb16" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
    <div class="flex" style="gap:8px"><button class="btn btn-primary btn-sm" id="uninsRefresh">${I.refresh} 刷新</button><span class="stat-chip" id="uninsCount" style="border-color:var(--border-2)">—</span><span class="stat-chip" style="border-color:var(--border-2)">卸载前请先退出目标程序</span></div>
    <div class="flex" style="gap:8px"><input placeholder="搜索软件…" id="uninsSearch" style="width:200px"><button class="btn btn-secondary btn-sm" id="uninsExport">${I.download} 导出</button></div></div>

async function loadUnins(){
  const r=await window.depk.getSoftware();

function drawUnins(list){
  const q=($('#uninsSearch')&&$('#uninsSearch').value||'').toLowerCase();
  const rows=list.filter(x=>!q||x.name.toLowerCase().includes(q)||(x.publisher||'').toLowerCase().includes(q));

  <thead><tr><th>名称</th><th>版本</th><th>发布者</th><th class="num">大小</th><th>安装日期</th><th>操作</th></tr></thead>
  <tbody>${rows.map(x=>`<tr><td style="font-weight:600">${esc(x.name)}</td><td class="mono" style="font-size:11px">${esc(x.version||'—')}</td><td style="color:var(--text-2);font-size:12px">${esc(x.publisher||'—')}</td><td class="num">${x.sizeKB>0?(x.sizeKB/1024).toFixed(1)+' MB':'—'}</td><td style="font-size:11px;color:var(--text-3)">${esc(x.date||'—')}</td>

    <button class="btn btn-secondary btn-sm" data-un="${esc(x.name)}" data-cmd="${esc(x.uninstall)}" data-q="${esc(x.quiet)}">卸载</button>
    <button class="btn btn-danger btn-sm" data-fr="${esc(x.name)}" data-key="${esc(x.key)}" data-loc="${esc(x.location)}">强制删除</button>
    <button class="btn btn-secondary btn-sm" data-res="${esc(x.name)}" data-loc2="${esc(x.location)}">残留清理</button>
    ${x.location?'<button class="btn btn-ghost btn-sm" data-open="'+esc(x.location)+'">定位</button>':''}
  </div></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--text-3)">无匹配程序</td></tr>'}</tbody></table></div>
  <div class="mt12" style="font-size:11px;color:var(--text-3)">· <b>卸载</b>：调用程序自带的卸载程序（优先静默模式）。· <b>强制删除</b>：跳过卸载程序，直接删除注册表项与安装目录（Geek 风格）。· <b>残留清理</b>：扫描注册表与文件系统中的残余项，勾选后删除。系统组件与 Microsoft Store 应用请勿强制删除。</div>`;
  $$('#uninsBox [data-un]').forEach(b=>b.onclick=()=>{
    const cmd=b.dataset.cmd,q=b.dataset.q;
    if(!cmd&&!q){toast('该程序没有卸载命令（可能为系统组件），建议用「强制删除」','warn');return;}
    confirmDlg('卸载程序','将调用卸载程序移除 <b>'+b.dataset.un+'</b>'+(q?'（优先静默卸载）':'（将打开卸载向导）')+'。确认继续？',async()=>{const r=await window.depk.uninstallApp(cmd,q);if(r.ok){toast(r.msg||'已启动卸载','ok');audit('卸载工具','卸载 '+b.dataset.un);}else toast('启动失败：'+r.err,'err');},'卸载');
  });
  $$('#uninsBox [data-fr]').forEach(b=>b.onclick=()=>{
    const loc=(b.dataset.loc||'');
    confirmDlg('强制删除','将直接删除 <b>'+b.dataset.fr+'</b> 的注册表项与安装目录（不运行卸载程序）'+(loc?'<br><span class="mono" style="font-size:11px">'+esc(loc)+'</span>':'')+'。此操作不可撤销！',async()=>{
      const r=await window.depk.forceRemove(b.dataset.key,b.dataset.fr,loc);
      toast('已强制删除'+(r.delDirs?'（含安装目录）':''),'ok');audit('卸载工具','强制删除 '+b.dataset.fr);loadUnins();
    },'强制删除');
  });
  $$('#uninsBox [data-res]').forEach(b=>b.onclick=()=>uninsScanResidual(b.dataset.res,(b.dataset.loc2||'')));
  $$('#uninsBox [data-open]').forEach(b=>b.onclick=()=>{if(REAL)window.depk.openLocation(b.dataset.open);else toast('需 Windows 版','warn');});
}
async function uninsScanResidual(name,loc){
  if(!REAL){toast('需 Windows 版','warn');return;}
  toast('正在扫描残留…','info');
  const r=await window.depk.scanResidual(name,loc);
  const items=r.ok?(r.data||[]):[];
  const totalReg=items.filter(x=>x.type==='reg').length, totalFile=items.filter(x=>x.type==='file').length;
  modal(`<div style="max-height:440px;overflow-y:auto">
    <div class="mb12" style="font-size:12.5px;color:var(--text-2)">找到 <b style="color:var(--amber)">${items.length}</b> 项残留（注册表 ${totalReg} · 文件 ${totalFile}）。勾选后点击删除。</div>
    ${items.length?`<div class="mb12"><label style="display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="resAll" style="width:15px;height:15px"> 全选</label></div>
    <div id="resList">${items.map((x,i)=>`<div class="list-item" style="align-items:center"><input type="checkbox" class="res-chk" data-i="${i}" style="width:15px;height:15px;flex:none"><span class="sev ${x.type==='reg'?'amber':'blue'}"></span><div class="grow"><div class="mono" style="font-size:11px;word-break:break-all">${esc(x.path)}</div><div style="font-size:10.5px;color:var(--text-3)">${x.type==='reg'?'注册表项':'文件'+(x.size?' · '+fmtSize(x.size):'')}</div></div></div>`).join('')}</div>`
    :`<div class="empty" style="padding:26px">${I.check}<div>未发现残留，程序清理得很干净</div></div>`}</div>`,
  {title:'残留扫描 - '+name,okTxt:items.length?'删除选中项':'关闭',showCancel:!!items.length,onOk:async()=>{
      if(!items.length)return;
      const sel=[...document.querySelectorAll('.res-chk:checked')].map(c=>items[Number(c.dataset.i)].path);
      if(!sel.length){toast('未选择任何项','warn');return false;}
      confirmDlg('删除残留','将永久删除选中的 '+sel.length+' 项残留（注册表项/文件），此操作不可撤销。确认？',async()=>{const d=await window.depk.deleteResidual(sel);toast('已删除 '+d.deleted+' 项残留','ok');audit('卸载工具','删除残留 '+name+' ('+d.deleted+' 项)');},'删除');
    }});
  const all=document.getElementById('resAll');if(all)all.onchange=()=>{document.querySelectorAll('.res-chk').forEach(c=>c.checked=all.checked);};
}
/* ================= 动态沙盒（Windows 版） ================= */
async function dynSandboxRun(samplePath){
  const box=document.getElementById('dynReport');if(!box)return;
  const secs=Number((document.getElementById('dynSecs')||{}).value||8);
  box.innerHTML=`<div class="dyn-load"><div class="scan-ring running" style="width:36px;height:36px;border-width:2px"><span class="sr-ico" style="width:14px;height:14px">${I.scan}</span></div><div style="font-size:12px;color:var(--text-2)">正在受限运行样本并采集行为（最长 ${secs} 秒）…</div></div>`;
  audit('动态沙盒',`运行样本 ${samplePath}（${secs} 秒）`);
  try{
    const r=await window.depk.dynSandbox(samplePath,secs);
    if(!r||!r.ok){box.innerHTML=`<div class="empty" style="padding:24px 12px">${I.warn}<div style="font-size:12px">动态分析失败：${esc(r&&r.err||'未知错误')}</div></div>`;return;}
    const procs=(r.procs||[]),files=(r.files||[]),conns=(r.conns||[]),events=(r.events||[]);
    box.innerHTML=`
    <div class="grid-3" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">
      <div class="card kpi" style="padding:10px"><div><div class="k-val" style="font-size:15px">${procs.length+1}</div><div class="k-lbl">进程（含主进程）</div></div></div>
      <div class="card kpi" style="padding:10px"><div><div class="k-val" style="font-size:15px;color:${conns.length?'var(--red)':'var(--green)'}">${conns.length}</div><div class="k-lbl">外联连接</div></div></div>
      <div class="card kpi" style="padding:10px"><div><div class="k-val" style="font-size:15px;color:${files.length?'var(--amber)':'var(--green)'}">${files.length}</div><div class="k-lbl">写入文件</div></div></div>
    </div>
    ${events.length?`<div class="mb12" style="font-size:11.5px;color:var(--text-2)">${events.map(e=>'· '+esc(e)).join('<br>')}</div>`:''}
    ${procs.length?`<div style="font-size:12px;font-weight:600;margin:8px 0 4px">子进程</div><div class="table-wrap"><table class="tbl"><colgroup><col style="width:12%"><col style="width:22%"><col style="width:14%"><col style="width:34%"><col style="width:18%"></colgroup><thead><tr><th>PID</th><th>名称</th><th>父PID</th><th>路径</th><th>时间</th></tr></thead><tbody>${procs.map(p=>'<tr><td class="num">'+p.pid+'</td><td>'+esc(p.name)+'</td><td class="num">'+p.parent+'</td><td class="mono" style="font-size:10px">'+esc(p.path||'—')+'</td><td style="font-size:11px">'+esc(p.time)+'</td></tr>').join('')}</tbody></table></div>`:''}
    ${conns.length?`<div style="font-size:12px;font-weight:600;margin:8px 0 4px">外联连接</div><div class="flex" style="flex-wrap:wrap;gap:6px">${conns.map(c=>'<span class="pill red">'+esc(c)+'</span>').join('')}</div>`:'<div class="mt8" style="font-size:11.5px;color:var(--green)">'+I.check+' 未观察到外联连接</div>'}
    ${files.length?`<div style="font-size:12px;font-weight:600;margin:8px 0 4px">写入文件</div><div class="mono" style="font-size:10.5px;color:var(--text-2);word-break:break-all">${files.map(f=>esc(f)).join('<br>')}</div>`:'<div class="mt8" style="font-size:11.5px;color:var(--green)">'+I.check+' 沙盒目录内未发现新增文件</div>'}
    <div class="mt12" style="font-size:11px;color:var(--text-3)">动态沙盒结论：${conns.length||files.length||procs.length?'存在可疑行为（外联/写文件/衍生进程），建议结合静态报告综合研判':'未观察到明显恶意行为'}</div>`;
    toast('动态沙盒分析完成','ok');
  }catch(err){
    box.innerHTML=`<div class="empty" style="padding:24px 12px">${I.warn}<div style="font-size:12px">动态分析异常：${esc(String(err&&err.message||err))}</div></div>`;
  }
}

</script>
