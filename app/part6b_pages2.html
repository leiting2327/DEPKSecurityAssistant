    <div class="grid-3">${[['数据防泄漏','敏感数据外发通道检测','on'],['敏感数据识别','内置 60+ 识别规则','on'],['数据分类分级','自动分级打标','on'],['加密管理','BitLocker + 文件加密策略','on'],['外发通道管控','邮件/网盘/IM/打印','on'],['DLP 水印','屏幕与打印水印','off']].map(c=>`<div class="tgl-row" style="border:1px solid var(--border)"><div class="t-info"><div class="t-title">${c[0]}</div><div class="t-desc">${c[1]}</div></div><div class="toggle ${c[2]==='on'?'on':''}"></div></div>`).join('')}</div></div>
  <div class="grid-2 mt16">
    <div class="card"><div class="card-title">敏感数据识别规则</div>
      <div class="table-wrap"><table class="tbl"><colgroup><col style="width:30%"><col style="width:40%"><col style="width:30%"></colgroup>
      <thead><tr><th>类型</th><th>规则</th><th class="num">今日命中</th></tr></thead>
      <tbody>${[['身份证号','18 位 + 校验位','12'],['银行卡号','16-19 位 Luhn','4'],['手机号','1[3-9]xxxxxxxxx','38'],['访问密钥','AK/SK 模式匹配','2'],['源代码','关键字 + 结构','0'],['客户隐私','姓名+手机号组合','7']].map(r=>`<tr><td style="font-weight:600">${r[0]}</td><td class="mono" style="font-size:11px">${r[1]}</td><td class="num">${r[2]}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><div class="card-title">数据分类分级</div>
      <div class="kv"><span class="k">一级 · 公开</span><span class="v">1,240 份</span></div>
      <div class="kv"><span class="k">二级 · 内部</span><span class="v">8,431 份</span></div>
      <div class="kv"><span class="k">三级 · 机密</span><span class="v">512 份</span></div>

}

/* ---------- 漏洞与补丁 ---------- */
function renderPatching(){
  $('#tbTitle').textContent='漏洞与补丁管理';$('#tbCrumb').textContent=PAGE_TITLE.patching;
  const crit=store.vulns.filter(v=>v.sev==='crit').length,high=store.vulns.filter(v=>v.sev==='high').length,patchable=store.vulns.filter(v=>v.status!=='已修复').length;
  $('#viewInner').innerHTML=`<div class="view-fade">
  ${pageHead('漏洞与补丁管理','资产漏洞扫描 · 补丁灰度下发 · 软件更新纳管',`<button class="btn btn-primary" id="btnVulnScan">${I.scan} 立即扫描漏洞</button>`)}
  <div class="kpi-grid mb16">
    <div class="card kpi"><div class="k-ico" style="background:var(--red-soft);color:var(--red)">${I.patch}</div><div><div class="k-val">${crit}</div><div class="k-lbl">严重漏洞</div></div></div>
    <div class="card kpi"><div class="k-ico" style="background:var(--amber-soft);color:var(--amber)">${I.warn}</div><div><div class="k-val">${high}</div><div class="k-lbl">高危漏洞</div></div></div>
    <div class="card kpi"><div class="k-ico" style="background:var(--accent-soft);color:var(--accent)">${I.clock}</div><div><div class="k-val">${patchable}</div><div class="k-lbl">待处理补丁</div></div></div>
    <div class="card kpi"><div class="k-ico" style="background:var(--green-soft);color:var(--green)">${I.check}</div><div><div class="k-val">${store.endpoints.filter(e=>e.risk==='low').length}/${store.endpoints.length}</div><div class="k-lbl">合规终端</div></div></div>
  </div>
  <div class="card"><div class="card-title flex between"><span>漏洞清单</span><div class="flex"><input placeholder="搜索 CVE / 产品…" style="width:220px" id="vulSearch"><select style="width:130px" id="vulFilter"><option>全部状态</option><option>待修复</option><option>待重启</option><option>已修复</option><option>已忽略</option></select></div></div>
    <div class="table-wrap"><table class="tbl"><colgroup><col style="width:15%"><col style="width:24%"><col style="width:9%"><col style="width:16%"><col style="width:16%"><col style="width:10%"><col style="width:10%"></colgroup>
    <thead><tr><th>编号</th><th>产品</th><th>严重度</th><th>当前版本</th><th>修复版本</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="vulRows">${store.vulns.map(v=>`<tr><td class="mono" style="font-size:11.5px">${v.id}</td><td style="font-weight:600">${esc(v.prod)}<div style="font-size:10.5px;color:var(--text-3)">${esc(v.risk)}</div></td><td><span class="pill ${v.sev==='crit'?'red':v.sev==='high'?'amber':'blue'}">${v.sev==='crit'?'严重':v.sev==='high'?'高危':'中危'}</span></td><td class="mono" style="font-size:11px">${esc(v.ver)}</td><td class="mono" style="font-size:11px">${esc(v.fix)}</td><td><span class="pill ${v.status==='已修复'?'green':v.status==='待修复'?'red':'amber'}">${v.status}</span></td><td><button class="btn btn-secondary btn-sm" data-fix="${v.id}">${v.status==='已修复'?'查看':'修复'}</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid-2 mt16">
    <div class="card"><div class="card-title">补丁管理</div>
      <div class="tgl-row"><div class="t-info"><div class="t-title">自动下载补丁</div><div class="t-desc">从更新代理拉取，支持缓存分发</div></div><div class="toggle on"></div></div>
      <div class="tgl-row"><div class="t-info"><div class="t-title">灰度发布</div><div class="t-desc">先 10% 终端验证再全量</div></div><div class="toggle on"></div></div>
      <div class="tgl-row"><div class="t-info"><div class="t-title">强制重启窗口</div><div class="t-desc">每日 02:00-05:00 静默重启</div></div><div class="toggle on"></div></div>
      <div class="tgl-row"><div class="t-info"><div class="t-title">回滚保护</div><div class="t-desc">补丁失败自动回滚上一版本</div></div><div class="toggle on"></div></div>
    </div>
    <div class="card"><div class="card-title">软件更新管理</div>
      <div class="kv"><span class="k">待更新应用</span><span class="v">23 个</span></div>
      <div class="kv"><span class="k">已过期版本</span><span class="v">7 个（含 2 个 EOL）</span></div>
      <div class="kv"><span class="k">更新成功率</span><span class="v">98.6%</span></div>
      <div class="kv"><span class="k">更新代理节点</span><span class="v">3 个（总部/华东/华南）</span></div>
      <button class="btn btn-secondary btn-sm mt12">${I.refresh} 检查软件更新</button></div>
  </div></div>`;
  $('#btnVulnScan').onclick=()=>{const b=$('#btnVulnScan');b.disabled=true;b.innerHTML=`${I.scan} 扫描中…`;setTimeout(()=>{b.disabled=false;b.innerHTML=`${I.scan} 立即扫描漏洞`;toast('漏洞扫描完成：发现 8 个漏洞（2 严重 3 高危）','ok');audit('漏洞扫描','全资产漏洞扫描完成');},1600);};
  $('#vulSearch').oninput=e=>filterVulns();$('#vulFilter').onchange=()=>filterVulns();
  $$('#vulRows [data-fix]').forEach(b=>b.onclick=()=>{const v=store.vulns.find(x=>x.id===b.dataset.fix);if(v.status==='已修复')return toast('该漏洞已修复','info');confirmDlg('修复 '+v.id,'将向受影响终端灰度下发补丁 '+v.fix+'。是否继续？',()=>{v.status='待重启';save();filterVulns();toast('补丁已下发，等待重启生效','ok');audit('补丁管理',`下发 ${v.id} 补丁`);},'下发补丁','btn-primary');});
}
function filterVulns(){const q=($('#vulSearch').value||'').toLowerCase(),f=$('#vulFilter').value;
  const list=store.vulns.filter(v=>(!q||(v.id+v.prod+v.risk).toLowerCase().includes(q))&&(f==='全部状态'||v.status===f));
  $('#vulRows').innerHTML=list.map(v=>`<tr><td class="mono" style="font-size:11.5px">${v.id}</td><td style="font-weight:600">${esc(v.prod)}<div style="font-size:10.5px;color:var(--text-3)">${esc(v.risk)}</div></td><td><span class="pill ${v.sev==='crit'?'red':v.sev==='high'?'amber':'blue'}">${v.sev==='crit'?'严重':v.sev==='high'?'高危':'中危'}</span></td><td class="mono" style="font-size:11px">${esc(v.ver)}</td><td class="mono" style="font-size:11px">${esc(v.fix)}</td><td><span class="pill ${v.status==='已修复'?'green':v.status==='待修复'?'red':'amber'}">${v.status}</span></td><td><button class="btn btn-secondary btn-sm" data-fix="${v.id}">${v.status==='已修复'?'查看':'修复'}</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--text-3);padding:22px">无匹配漏洞</td></tr>';
  $$('#vulRows [data-fix]').forEach(b=>b.onclick=()=>{const v=store.vulns.find(x=>x.id===b.dataset.fix);if(v.status==='已修复')return toast('该漏洞已修复','info');confirmDlg('修复 '+v.id,'将向受影响终端灰度下发补丁 '+v.fix+'。是否继续？',()=>{v.status='待重启';save();filterVulns();toast('补丁已下发，等待重启生效','ok');audit('补丁管理',`下发 ${v.id} 补丁`);},'下发补丁','btn-primary');});}
</script>
