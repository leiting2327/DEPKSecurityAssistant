function fmtDT(d){d=d||new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}
function relT(ts){const s=(Date.now()-ts)/1000;if(s<60)return '刚刚';if(s<3600)return Math.floor(s/60)+' 分钟前';if(s<86400)return Math.floor(s/3600)+' 小时前';return Math.floor(s/86400)+' 天前';}
function fmtSize(b){if(b==null)return'-';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB';}
async function sha256(buf){const d=await crypto.subtle.digest('SHA-256',buf);return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function entropy(buf){const len=Math.min(buf.length,65536);if(len<8)return 0;const freq=new Array(256).fill(0);for(let i=0;i<len;i++)freq[buf[i]]++;let e=0;for(let i=0;i<256;i++){if(freq[i]){const p=freq[i]/len;e-=p*Math.log2(p);}}return e;}
function toBlobUrl(data){return URL.createObjectURL(new Blob([data]));}
function download(name,content,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime||'application/octet-stream'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}

function toast(msg,type='info'){const box=$('#toasts');const t=document.createElement('div');t.className='toast '+type;
  const ico=type==='ok'?I.check:type==='err'?I.x:type==='warn'?I.warn:I.info;
  t.innerHTML=`<span class="t-ico">${ico}</span><span>${esc(msg)}</span>`;
  box.appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260);},3400);}

/* ================= 弹窗 ================= */
let modalCb=null;
function modal(html,{title='',okTxt='确定',cancelTxt='取消',showCancel=true,okClass='btn-primary',onOk=null,wide=false}={}){
  const m=$('#modalMask'),b=$('#modalBox');
  b.className='modal'+(wide?' wide':'');
  b.innerHTML=`<div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" id="mClose">${I.x}</button></div>
  <div class="modal-body">${html}</div>
  ${showCancel||onOk?`<div class="modal-foot"><button class="btn btn-ghost" id="mCancel">${esc(cancelTxt)}</button><button class="btn ${okClass}" id="mOk">${esc(okTxt)}</button></div>`:''}`;
  m.classList.add('show');modalCb=onOk;
  const close=()=>{m.classList.remove('show');modalCb=null;};
  b.querySelector('#mClose').onclick=close;
  const c=b.querySelector('#mCancel');if(c)c.onclick=close;
  const o=b.querySelector('#mOk');if(o)o.onclick=()=>{const r=onOk?onOk():true;if(r!==false)close();};
  m.onclick=e=>{if(e.target===m)close();};
  return close;
}

/* ================= SVG 图表库 ================= */
function svgLine(sel,data,{h=150,color='var(--accent)',fill=true,labels=true,max=null,minW=null}={}){
  const maxV=max||Math.max(...data)*1.15;const W=640,H=h,P=6;
  const pts=data.map((v,i)=>[P+i*(W-2*P)/Math.max(1,data.length-1),H-P-(v/maxV)*(H-2*P)]);
  const path='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
  const area=path+`L${pts[pts.length-1][0].toFixed(1)} ${H-P}L${pts[0][0].toFixed(1)} ${H-P}Z`;
  let dots='';if(labels)dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--panel-solid)" stroke="${color}" stroke-width="2"><title>${data[i]}</title></circle>`).join('');
  const gid=uid();
  $(sel).innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${fill?`<path d="${area}" fill="url(#${gid})"/>`:''}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function svgBars(sel,items,{h=170,color='var(--accent)'}={}){
  const W=640,H=h,P=8;const maxV=Math.max(...items.map(i=>i.v))*1.2;
  const bw=(W-2*P)/items.length*0.55;
  const bars=items.map((it,i)=>{const x=P+i*(W-2*P)/items.length+(W-2*P)/items.length*0.225;const bh=Math.max(2,(it.v/maxV)*(H-30));const y=H-22-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${it.c||color}"><title>${esc(it.l)}: ${it.v}</title></rect><text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text-3)">${esc(it.l)}</text>`;}).join('');
  $(sel).innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}</svg>`;
}
function svgDonut(sel,items,{size=150,hole=0.62}={}){ // items:[{l,v,c}]
  const R=size/2, r=R*hole, C=2*Math.PI*R, total=items.reduce((s,i)=>s+i.v,0)||1;
  let off=0;const segs=items.map(it=>{const frac=it.v/total;const dash=frac*C;const s=`<circle r="${R}" cx="${R}" cy="${R}" fill="none" stroke="${it.c}" stroke-width="${R-r}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${R} ${R})"><title>${esc(it.l)}: ${it.v} (${(frac*100).toFixed(1)}%)</title></circle>`;off+=dash;return s;}).join('');
  $(sel).innerHTML=`<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;margin:0 auto">${segs}<circle r="${r}" cx="${R}" cy="${R}" fill="var(--panel-solid)" stroke="none"/></svg>`;
}
function spark(sel,data,color){svgLine(sel,data,{h:44,labels:false,fill:true,color});}
function scoreRing(sel,val,color){const R=56,C=2*Math.PI*R;$(sel).innerHTML=`<div class="score-ring"><svg viewBox="0 0 120 120"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--panel-2)" stroke-width="10"/><circle r="${R}" cx="60" cy="60" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(val/100*C).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="sr-txt"><b style="color:${color}">${val}</b><span>/ 100</span></div></div>`;}

function renderNav(){
  const n=$('#nav');
  n.innerHTML=`<div class="nav-brand"><div class="logo">${I.shieldck}</div><div class="brand-txt"><b>DEPK Security</b><span>ASSISTANT</span></div>
  <button class="icon-btn" id="navCollapse" style="margin-left:auto" title="折叠导航">${I.grid}</button></div>
  <div class="nav-items">${NAV.map(x=>`<div class="nav-item${store.page===x.id?' active':''}" data-go="${x.id}"><span class="ni">${I[x.i]}</span><span class="lbl">${x.l}</span></div>`).join('')}</div>
  <div class="nav-foot"><div class="nav-item" data-go="settings"><span>${I.gear}</span><span class="lbl f-txt">设置</span></div></div>`;
  $$('#nav .nav-item').forEach(el=>el.onclick=()=>go(el.dataset.go));
  $('#navCollapse').onclick=()=>{store.navCollapsed=!store.navCollapsed;save();n.classList.toggle('collapsed',store.navCollapsed);};
  n.classList.toggle('collapsed',store.navCollapsed);
}
function pageHead(title,sub,actions=''){
  return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="page-actions">${actions}</div></div>`;
}
function tabBar(tabs,cur,page){ // tabs:[{id,l,count?}]
  return `<div class="tabbar">${tabs.map(t=>`<div class="tab${t.id===cur?' active':''}" data-tab="${t.id}">${t.l}${t.count!=null?` <span class="badge-num" style="background:var(--panel-2);color:var(--text-2);font-size:10px;height:17px;min-width:17px">${t.count}</span>`:''}</div>`).join('')}</div>`;
}
let activePageCb=null;
