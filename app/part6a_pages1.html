  </div>

  <div class="grid-2 mt16" style="grid-template-columns:1fr 1.7fr">

        <div class="card quick-card hover" data-act="quick"><div class="qc-ico" style="background:var(--accent-soft);color:var(--accent)">${I.scan}</div><div class="qc-t">快速扫描</div><div class="qc-d">检查常用目录，约 40 秒</div></div>
        <div class="card quick-card hover" data-act="full"><div class="qc-ico" style="background:var(--green-soft);color:var(--green)">${I.shield}</div><div class="qc-t">全面扫描</div><div class="qc-d">全盘深度检测，约 12 分钟</div></div>
        <div class="card quick-card hover" data-act="custom"><div class="qc-ico" style="background:var(--amber-soft);color:var(--amber)">${I.folder}</div><div class="qc-t">自定义扫描</div><div class="qc-d">选择文件夹精准检测</div></div>
        <div class="card quick-card hover" data-act="usb"><div class="qc-ico" style="background:var(--purple-soft);color:var(--purple)">${I.usb}</div><div class="qc-t">U盘扫描</div><div class="qc-d">扫描可移动介质</div></div>

}
function bindDash(){
  $('#dashQuick').onclick=()=>startScan('quick');
  $('#dashFull').onclick=()=>startScan('full');
  $('#dashEicar').onclick=genEicar;
  $$('#viewInner [data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='quick')startScan('quick');else if(a==='full')startScan('full');else if(a==='custom')startScan('custom');
    else if(a==='usb')startScan('usb');else if(a==='eicar')genEicar();
    else if(a==='sand')go('threat','sand');else if(a==='pol')go('mgmt','pol');else if(a==='report')go('compliance','rep');else if(a==='alerts')go('edr','alert');
  });
}

/* ---------- 病毒和威胁防护 ---------- */
const PROT_TABS=[{id:'home',l:'保护状态'},{id:'scan',l:'扫描选项',count:3},{id:'quar',l:'隔离区',count:null},{id:'excl',l:'排除项'},{id:'caps',l:'防护能力'}];
function renderProtection(){
  const tab=store.tab||'home';
  $('#tbTitle').textContent='病毒和威胁防护';$('#tbCrumb').textContent=PAGE_TITLE.protection;
  $('#viewInner').innerHTML=`<div class="view-fade"><div class="pagerow">${tabBar(PROT_TABS.map(t=>({...t,count:t.id==='quar'?store.quarantine.length:t.count})),tab,'protection')}</div><div id="protBody"></div></div>`;
  bindTabs('#viewInner','protection');
  const body={home:rProtHome,scan:rProtScan,quar:rProtQuar,excl:rProtExcl,caps:rProtCaps}[tab];
  body&&body();
}
function rProtHome(){
  const caps=[
   ['实时保护',store.realtime,'检测文件创建、修改与执行','realtime'],['云查杀',store.cloud,'云端海量特征与信誉查询','cloud'],
   ['AI/机器学习检测',store.ai,'本地模型实时威胁打分','ai'],['启发式分析',store.heuristic,'未知样本行为特征启发','heuristic'],
   ['勒索软件防护',true,'文件夹保护 + 行为回滚',null],['无文件/内存防护',true,'脚本与内存载荷检测',null],['漏洞利用防护',true,'Exploit 缓解措施',null],['Web/邮件防护',true,'恶意网页与钓鱼邮件',null]];
  $('#protBody').innerHTML=`
  <div class="card"><div class="card-title">实时保护</div>
    <div class="flex" style="justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <div class="flex" style="gap:16px"><div style="width:64px;height:64px;border-radius:16px;background:${store.realtime?'var(--green-soft)':'var(--red-soft)'};color:${store.realtime?'var(--green)':'var(--red)'};display:flex;align-items:center;justify-content:center">${store.realtime?I.shieldck:I.shieldX}</div>
      <div><div style="font-size:16px;font-weight:700">${store.realtime?'实时保护已开启':'实时保护已关闭'}</div><div style="font-size:12px;color:var(--text-3);margin-top:2px">扫描正在创建和修改的文件、进程行为与脚本执行，拦截已知和未知威胁</div></div></div>
      <div class="toggle ${store.realtime?'green on':''}" id="tgRealtime" data-t="realtime"></div>
    </div>
    <div class="mt16" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${caps.map(c=>`<div class="tgl-row" style="border:1px solid var(--border)"><div class="t-info"><div class="t-title">${c[0]}</div><div class="t-desc">${c[1]}</div></div>${c[3]?`<div class="toggle ${store[c[3]]?'on':''}" data-t="${c[3]}"></div>`:`<span class="pill green">已启用</span>`}</div>`).join('')}</div>
  </div>
  <div class="grid-3 mt16">
    <div class="card"><div class="card-title">病毒库信息</div><div class="kv"><span class="k">病毒特征库版本</span><span class="v">${store.updateVer}</span></div>
      <div class="kv"><span class="k">特征数量</span><span class="v">${store.sigCount.toLocaleString()}</span></div>
      <div class="kv"><span class="k">引擎版本</span><span class="v">${store.engineVer}</span></div>
      <div class="kv"><span class="k">上次更新</span><span class="v">刚刚</span></div>
      <button class="btn btn-secondary mt16" id="btnUpdDb">${I.refresh} 立即更新病毒库</button></div>
    <div class="card"><div class="card-title">防护能力覆盖 <span class="sub">MITRE ATT&CK</span></div>
      <div class="flex" style="flex-wrap:wrap;gap:8px" id="covChips"></div>
      <div class="progress mt12"><div class="bar" style="width:87%"></div></div><div style="font-size:11.5px;color:var(--text-3);margin-top:6px">已覆盖 14 个战术 · 87 个技术 · 覆盖度 87%</div></div>
    <div class="card"><div class="card-title">防护场景</div>
      <div class="flex" style="flex-wrap:wrap;gap:8px">${['APT 防护','僵尸网络','挖矿防护','间谍软件','Rootkit','引导区','PowerShell','宏病毒','浏览器','身份威胁','零信任','容器','VDI','云工作负载','离线终端'].map(s=>`<span class="pill blue">${s}</span>`).join('')}</div>
      <div class="mt16" style="font-size:12px;color:var(--text-3)">共 ${FEATURES.reduce((n,g)=>n+g.items.length,0)} 项安全能力，全部纳入统一策略管理</div></div>
  </div>
  <div class="card mt16"><div class="card-title">近期防护事件</div>
    <div id="protEvents">${store.alerts.slice(0,4).map(a=>`<div class="alert-row ${a.sev}"><span class="sev ${a.sev}"></span><div class="grow"><div style="font-size:13px;font-weight:600">${esc(a.title)}</div><div style="font-size:11.5px;color:var(--text-3)">${esc(a.ep)} · ${esc(a.tech)} · ${relT(a.time)}</div></div><span class="pill ${a.status==='resolved'?'green':'blue'}">${a.status==='resolved'?'已处置':'处理中'}</span></div>`).join('')}</div></div>`;
  bindToggles();
  $('#btnUpdDb').onclick=()=>{const b=$('#btnUpdDb');b.disabled=true;b.innerHTML=`${I.refresh} 正在更新…`;setTimeout(()=>{store.updateVer='2026.09.15.02';store.sigCount+=12847;b.innerHTML=`${I.check} 更新完成`;toast('病毒库已更新至 2026.09.15.02','ok');audit('病毒库更新','更新至 2026.09.15.02，新增特征 12,847');save();setTimeout(()=>{b.disabled=false;b.innerHTML=`${I.refresh} 立即更新病毒库`;},1500);},1400);};

function bindToggles(){$$('#protBody .toggle').forEach(t=>{t.onclick=()=>{const k=t.dataset.t;if(k){store[k]=!store[k];t.classList.toggle('on',store[k]);save();audit('防护设置',`${k} ${store[k]?'开启':'关闭'}`);toast(`${k==='realtime'?'实时保护':k==='cloud'?'云查杀':k==='ai'?'AI 检测':'启发式分析'}已${store[k]?'开启':'关闭'}`,'ok');
        if(k==='realtime'&&REAL){if(store.realtime){window.depk.watchStart([]).then(r=>{if(r.ok){store.watchState=true;toast('实时保护已启用：正在监控 下载/桌面/文档','ok');}else toast('监控启动失败：'+r.err,'err');});}else{window.depk.watchStop();store.watchState=false;}}
        if(k==='cloud'&&REAL){toast('云查杀需连接 DEPK 云服务；本地引擎已内置检测能力','info');}
      }else{toast('该能力已通过策略统一管控','info');}};});}
function rProtScan(){
  const modes=[['quick','快速扫描','检查常用目录（用户、下载、临时文件等）','#4cc2ff',I.scan],['full','全面扫描','全盘深度扫描，包括系统与引导区','#35c759',I.shield],['custom','自定义扫描','选择特定文件夹或文件','#f5b82e',I.folder],['usb','U盘扫描','扫描可移动存储介质','#b884f5',I.usb],['offline','离线扫描','使用离线特征库，适合隔离网络','#2fd8c7',I.cloud],['schedule','定时扫描','按计划自动执行（默认每日 02:00）','#8f8f8f',I.clock]];
  $('#protBody').innerHTML=`
  <div class="card"><div class="card-title">扫描选项</div>
    <div class="quick-grid" style="grid-template-columns:repeat(3,1fr)">${modes.map(m=>`<div class="card quick-card hover" data-scan="${m[0]}"><div class="qc-ico" style="background:color-mix(in srgb,${m[3]} 16%,transparent);color:${m[3]}">${m[4]}</div><div class="qc-t">${m[1]}</div><div class="qc-d">${m[2]}</div></div>`).join('')}</div>
  </div>
  <div id="scanBox"></div>
  <div class="card mb16" style="border-color:var(--accent-line)">
    <div class="card-title flex between"><span>${I.shield} 真实本机扫描 <span class="pill green">Windows 原生引擎</span></span><span class="sub">文件真实读取 · 熵/PE/脚本特征分析 · 命中自动隔离</span></div>
    <div class="flex" style="gap:10px;flex-wrap:wrap">
      <input id="realScanPath" placeholder="输入要扫描的目录（如 C:\Users\你的用户名\Downloads），留空扫描用户目录" style="flex:1;min-width:280px">
      <button class="btn btn-primary" id="btnRealScan">${I.scan} 开始扫描</button>
      <button class="btn btn-secondary" id="btnRealQuick">${I.shield} 快速扫描（下载/桌面/文档）</button>
    </div>
    <div style="font-size:11.5px;color:var(--text-3);margin-top:8px">${REAL?'真实能力：递归扫描真实文件（最多 6000 个）、熵值分析、PE 导入表/加壳检测、脚本/宏/勒索/挖矿特征识别；发现威胁自动移入隔离区并可随时恢复。':'浏览器预览版无法访问本机文件，请运行 Windows 安装版「DEPK Security Assistant.exe」。'}</div>
  </div>
  <div class="grid-2 mt16">
    <div class="card"><div class="card-title">测试工具</div>
      <p style="font-size:12.5px;color:var(--text-2)">EICAR 是国际标准防病毒测试文件，无毒无害。生成后使用扫描功能检测它，即可验证防护是否生效。</p>
      <div class="flex mt12"><button class="btn btn-primary" id="btnEicar">${I.zap} 生成 EICAR 测试文件</button><button class="btn btn-secondary" id="btnEicarScan" data-scan="demo">${I.scan} 用演示扫描检测</button></div>
      <div class="mt12" style="font-size:11.5px;color:var(--text-3)">提示：也可将任意可疑文件拖入「威胁情报 → 沙箱分析」进行静态检测。</div>
    </div>
    <div class="card"><div class="card-title">定时扫描</div>
      <div class="kv"><span class="k">计划任务</span><span class="v">每日 02:00 · 快速扫描</span></div>
      <div class="kv"><span class="k">下次执行</span><span class="v" id="nextScanTime">${fmtDT(new Date(T+9*H))}</span></div>
      <div class="flex mt12"><button class="btn btn-secondary btn-sm">编辑计划</button><button class="btn btn-ghost btn-sm">暂停</button></div>
    </div>
  </div>
  <div class="card mt16"><div class="card-title">扫描历史</div>
    <div class="table-wrap"><table class="tbl"><colgroup><col style="width:12%"><col style="width:10%"><col style="width:10%"><col style="width:16%"><col style="width:13%"><col style="width:12%"><col style="width:15%"><col style="width:12%"></colgroup>
    <thead><tr><th>类型</th><th>引擎</th><th>耗时</th><th>扫描路径</th><th class="num">文件数</th><th class="num">威胁</th><th>结果</th><th>时间</th></tr></thead>
    <tbody>${store.scanHist.map(h=>`<tr><td>${esc(h.type)}</td><td><span class="tag">${esc(h.mode)}</span></td><td>${esc(h.dur)}</td><td class="mono">${esc(h.path)}</td><td class="num">${h.files.toLocaleString()}</td><td class="num" style="color:${h.threats>0?'var(--red)':'var(--green)'};font-weight:700">${h.threats}</td><td><span class="pill ${h.threats>0?'red':'green'}">${esc(h.result)}</span></td><td style="color:var(--text-3)">${relT(h.time)}</td></tr>`).join('')}</tbody></table></div></div>`;
  $$('#protBody [data-scan]').forEach(c=>c.onclick=()=>startScan(c.dataset.scan));

  $('#btnRealQuick')&&($('#btnRealQuick').onclick=()=>startScan('real','quick'));
  $('#btnEicar').onclick=genEicar;
}
function startScan(mode,pathInput){if(store.page!=='protection'){go('protection','scan');setTimeout(()=>startScan(mode,pathInput),60);return;}
  if(mode==='real'){if(!REAL){toast('请安装 Windows 版使用真实扫描','warn');return;}realScanReal(pathInput||'quick');return;}
  if(mode==='custom'){if(window.showDirectoryPicker){realScan('custom');}else{toast('当前环境不支持目录选择，已使用演示扫描','warn');realScan('demo');}return;}
  if(mode==='quick'){store.scanState={mode:'demo'};toast('快速扫描已启动（演示数据）','info');realScan('demo');return;}
  if(mode==='full'){toast('全面扫描已启动（演示数据）','info');realScan('demo');return;}
  if(mode==='usb'){toast('U盘扫描已启动（演示数据）','info');realScan('demo');return;}
  if(mode==='offline'){toast('离线扫描已启动（演示数据）','info');realScan('demo');return;}
  if(mode==='schedule'){toast('已保存定时扫描计划：每日 02:00','ok');audit('计划任务','设置定时扫描 每日 02:00');return;}
  realScan(mode);
}
async function rProtQuar(){
  let realQ=[];
  if(REAL){try{const rq=await window.depk.listQuarantine();realQ=rq.ok?(rq.data||[]):[];}catch(e){}}
  store.realQ=realQ;
  const items=[...realQ.map(q=>({...q,real:true})),...store.quarantine.map(q=>({...q,real:false}))];
  $('#protBody').innerHTML=`
  <div class="grid-3 mb16">
    <div class="card kpi"><div class="k-ico" style="background:var(--red-soft);color:var(--red)">${I.shieldX}</div><div><div class="k-val">${items.length}</div><div class="k-lbl">隔离项目（真实 ${realQ.length}）</div></div></div>
    <div class="card kpi"><div class="k-ico" style="background:var(--amber-soft);color:var(--amber)">${I.location}</div><div><div class="k-val">${fmtSize(items.reduce((a,b)=>a+(b.size||0),0))}</div><div class="k-lbl">隔离占用空间</div></div></div>
    <div class="card kpi"><div class="k-ico" style="background:var(--green-soft);color:var(--green)">${I.check}</div><div><div class="k-val">${store.quarantinedCount||0}</div><div class="k-lbl">累计处理威胁</div></div></div>
  </div>
  <div class="card mb16"><div class="card-title flex between"><span>${I.shieldX} 隔离区</span><div class="flex" style="gap:8px"><button class="btn btn-secondary btn-sm" id="qRefresh">${I.refresh} 刷新</button>${items.length?`<button class="btn btn-secondary btn-sm" id="qExp">${I.download} 导出清单</button>`:''}${REAL&&items.some(x=>x.real)?`<button class="btn btn-secondary btn-sm" id="qOpen">${I.folder} 打开隔离目录</button>`:''}</div></div>
  <div class="table-wrap"><table class="tbl"><colgroup><col style="width:20%"><col style="width:16%"><col style="width:12%"><col style="width:8%"><col style="width:16%"><col style="width:10%"><col style="width:18%"></colgroup>
  <thead><tr><th>文件名</th><th>原始路径 / 类型</th><th>大小</th><th>来源</th><th>威胁类型</th><th>隔离时间</th><th>操作</th></tr></thead>
  <tbody>${items.map(q=>`
    <tr><td style="font-weight:600">${esc(q.name)}</td>
    <td class="mono" style="font-size:10.5px">${q.real?esc(q.origPath):'（演示记录）'+esc(q.path||'')}</td>
    <td class="num">${fmtSize(q.size||0)}</td>
    <td><span class="pill ${q.real?'blue':'gray'}">${q.real?'真实':'演示'}</span></td>
    <td><span class="pill ${q.sev==='crit'||q.sev==='high'?'red':'amber'}">${esc(q.verdict||'威胁')}</span></td>
    <td style="font-size:11px;color:var(--text-3)">${esc(q.time?fmtT(q.time):'—')}</td>
    <td><div class="flex" style="gap:6px">${q.real
      ?`<button class="btn btn-secondary btn-sm" data-req="${q.id}">恢复</button><button class="btn btn-danger btn-sm" data-dq="${q.id}">删除</button>`
      :`<button class="btn btn-secondary btn-sm" data-rq="${q.id}">恢复</button><button class="btn btn-secondary btn-sm" data-eq="${q.id}">导出</button><button class="btn btn-danger btn-sm" data-qq="${q.id}">删除</button>`}</div></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--text-3);padding:28px">隔离区为空 — 安全状态良好</td></tr>'}</tbody></table></div></div>
  <div class="card"><div class="card-title">${I.info} 隔离机制说明</div>
    <p style="font-size:12.5px;color:var(--text-2);line-height:1.7">· <b>真实隔离（Windows 版）</b>：检测到的真实文件被移入 <span class="mono">用户目录\DEPKSecurity\Quarantine\</span>，以 ID 重命名并记录元数据，可随时恢复到原始路径。<br>
    · <b>演示记录</b>：网页预览版中的模拟威胁记录，仅供界面演示。<br>
    · 恢复前请确认文件安全；删除将永久移除文件。</p></div>`;
  $$('#protBody [data-rq]').forEach(b=>b.onclick=()=>{const it=store.quarantine.find(x=>x.id===b.dataset.rq);if(it){store.quarantine.splice(store.quarantine.indexOf(it),1);save();toast('文件已恢复到原位置','ok');rProtQuar();}});
  $$('#protBody [data-qq]').forEach(b=>b.onclick=()=>{const it=store.quarantine.find(x=>x.id===b.dataset.qq);if(it){store.quarantine.splice(store.quarantine.indexOf(it),1);save();toast('文件已删除','ok');rProtQuar();}});
  $$('#protBody [data-eq]').forEach(b=>{const it=store.quarantine.find(x=>x.id===b.dataset.eq);if(it&&it.raw){b.onclick=()=>download('quarantine_'+it.id+'.bin',it.raw,'application/octet-stream');}});
  $$('#protBody [data-req]').forEach(b=>b.onclick=async()=>{const r=await window.depk.restoreQuarantine(b.dataset.req);if(r.ok){toast('已恢复到原始路径','ok');audit('隔离区','恢复隔离文件 '+b.dataset.req);rProtQuar();}else toast('恢复失败：'+r.err,'err');});
  $$('#protBody [data-dq]').forEach(b=>b.onclick=async()=>{const r=await window.depk.deleteQuarantine(b.dataset.dq);if(r.ok){toast('隔离文件已永久删除','ok');audit('隔离区','删除隔离文件 '+b.dataset.dq);rProtQuar();}else toast('删除失败：'+r.err,'err');});
  const qr=$('#qRefresh');if(qr)qr.onclick=()=>rProtQuar();
  const qe=$('#qExp');if(qe)qe.onclick=()=>{const csv=[['文件名','原始路径','大小','威胁类型','时间']];items.forEach(q=>csv.push([q.name,q.origPath||q.path||'',q.size||0,q.verdict||'',q.time||'']));download('隔离清单.csv',csv.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');toast('隔离清单已导出','ok');};
  const qo=$('#qOpen');if(qo)qo.onclick=()=>{toast('隔离目录位于 用户目录\\DEPKSecurity\\Quarantine','info');};
}
function rProtExcl(){
  $('#protBody').innerHTML=`

    <p style="font-size:12px;color:var(--text-3);margin-bottom:12px">排除项会跳过实时保护与扫描，请谨慎添加。支持文件、文件夹、进程与扩展名。</p>
    ${store.exclusions.length?`<div class="table-wrap"><table class="tbl"><colgroup><col style="width:14%"><col style="width:46%"><col style="width:18%"><col style="width:10%"><col style="width:12%"></colgroup>
    <thead><tr><th>类型</th><th>目标</th><th>生效范围</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${store.exclusions.map(e=>`<tr><td><span class="tag">${esc(e.type)}</span></td><td class="mono">${esc(e.target)}</td><td>${esc(e.scope)}</td><td><span class="pill green">启用</span></td><td><button class="btn btn-ghost btn-sm" data-del="${e.id}" style="color:var(--red)">${I.trash}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${I.folder}<div>暂无排除项</div></div>`}
  </div>
  <div class="card mt16"><div class="card-title">白名单 / 黑名单</div>
    <div class="flex" style="gap:14px;flex-wrap:wrap">
      <div class="grow"><div class="tgl-row" style="border:1px solid var(--border)"><div class="t-info"><div class="t-title">应用白名单模式</div><div class="t-desc">仅允许受信任应用运行（服务器/工控场景）</div></div><div class="toggle on green"></div></div></div>
      <div class="grow"><div class="tgl-row" style="border:1px solid var(--border)"><div class="t-info"><div class="t-title">哈希黑名单</div><div class="t-desc">命中黑名单哈希的文件直接拦截</div></div><div class="toggle on red"></div></div></div>
      <div class="grow"><div class="tgl-row" style="border:1px solid var(--border)"><div class="t-info"><div class="t-title">驱动加载控制</div><div class="t-desc">仅允许签名驱动加载</div></div><div class="toggle on"></div></div></div>
    </div></div>`;
  $('#addExcl').onclick=()=>modal(`<div class="flex col" style="gap:10px">
    <label style="font-size:12.5px;color:var(--text-3)">类型</label><select id="exType"><option>文件</option><option>文件夹</option><option>进程</option><option>扩展名</option></select>
    <label style="font-size:12.5px;color:var(--text-3)">目标路径 / 名称</label><input id="exTarget" placeholder="例如 C:\\tools\\ 或 *.log">
    <label style="font-size:12.5px;color:var(--text-3)">生效范围</label><select id="exScope"><option>实时保护 + 扫描</option><option>仅实时保护</option><option>仅手动扫描</option></select></div>`,
    {title:'添加排除项',onOk:()=>{const t=$('#exTarget').value.trim();if(!t){toast('请输入目标','warn');return false;}store.exclusions.push({id:uid(),type:$('#exType').value,target:t,scope:$('#exScope').value});save();audit('排除项',`添加排除项 ${t}`);renderView();toast('排除项已添加','ok');}});
  $$('#protBody [data-del]').forEach(b=>b.onclick=()=>{store.exclusions=store.exclusions.filter(e=>e.id!==b.dataset.del);save();renderView();});
}
